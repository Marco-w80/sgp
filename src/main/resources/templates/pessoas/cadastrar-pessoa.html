<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">


<style>
  /* ==========================================================================
       1. ESTILOS GERAIS E VARIÁVEIS (Pode ir para um arquivo global depois)
       ========================================================================== */
  :root {
    --cor-primaria: #166298;
    --cor-secundaria: #192f51;
    --cor-sucesso: #1cc88a;
    --cor-perigo: #e74a3b;
    --cor-fundo-claro: #f8f9fc;
    --cor-texto: #5a5c69;
  }

  /* ==========================================================================
       2. PADRÃO PARA FORMULÁRIOS DE CADASTRO E EDIÇÃO
       ========================================================================== */

  /* Padroniza o cabeçalho do card */
  .card-header.form-header {
    background-color: var(--cor-fundo-claro);
    border-bottom: 2px solid var(--cor-primaria);
  }

  .form-header .font-weight-bold {
    color: var(--cor-primaria) !important;
    /* Garante que a cor primária seja usada */
    font-size: 1.1rem;
  }

  /* Estiliza os rótulos (labels) dos campos */
  form label {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--cor-secundaria);
  }

  /* Dá destaque ao campo quando ele está em foco (selecionado) */
  .form-control:focus {
    border-color: var(--cor-primaria);
    box-shadow: 0 0 0 0.2rem rgba(22, 98, 152, 0.25);
    /* Sombra com a cor primária */
  }

  /* Melhora a interação com o botão principal */
  .btn-primary {
    background-color: var(--cor-primaria);
    border-color: var(--cor-primaria);
    transition: background-color 0.2s ease-in-out;
  }

  .btn-primary:hover {
    background-color: var(--cor-secundaria);
    /* Usa o azul mais escuro no hover */
    border-color: var(--cor-secundaria);
  }

  /* Estiliza os subtítulos dentro do formulário para separar seções */
  form h6 {
    margin-top: 1.5rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #e3e6f0;
    color: var(--cor-secundaria);
    font-weight: 700;
  }

  /* ==========================================================================
   BOTÃO DE SALVAR PERSONALIZADO
   ========================================================================== */
  .btn-salvar-custom {
    background-color: var(--cor-primaria) !important;
    padding: 10px 28px !important;
    /* Deixa o botão um pouco maior e mais largo */
    font-size: 1rem !important;
    /* Garante um bom tamanho de fonte */
    font-weight: 600 !important;
    /* Texto um pouco mais forte */
    letter-spacing: 0.5px !important;
    /* Leve espaçamento para um look mais refinado */
    border-radius: 8px !important;
    /* Bordas um pouco mais arredondadas */
    transition: all 0.3s ease !important;
    /* Transição suave para todos os efeitos */
  }

  .btn-salvar-custom:hover {
    background-color: var(--cor-secundaria) !important;
    /* Azul mais escuro no hover */
    border-color: var(--cor-secundaria) !important;
    transform: translateY(-3px) !important;
    /* Efeito sutil de "levantar" o botão */
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2) !important;
    /* Sombra mais destacada */
  }
</style>

<th:block th:replace="~{fragments/head :: top}"></th:block>

<div class="text-right mb-0 pb-0">
  <p class="text-muted small">Os campos marcados com <span class="text-danger">*</span> são obrigatórios.</p>
</div>

<div class="card shadow mb-4">
  <div class="card-header py-3 form-header">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-user-plus mr-2"></i> Cadastrar Pessoa
    </h6>
  </div>

  <div class="card-body">
    <form th:action="@{/pessoas/cadastrar}" th:object="${pessoaForm}" method="post" class="needs-validation" novalidate
      onsubmit="return showSweetAlert()">
      <div class="form-row">
        <div class="form-group col-md-2">
          <label for="tipo">Tipo<span class="text-danger">*</span></label>
          <select id="tipo" name="tipo" class="form-control" onchange="toggleFields()" required>
            <option value="" disabled selected>Selecione...</option>
            <th:block th:each="t : ${tipos}">
              <option th:value="${t}" th:text="${t}"></option>
            </th:block>
          </select>
        </div>
        <div class="form-group col-md-8">
          <label>Nome<span class="text-danger">*</span></label>
          <input type="text" name="nome" class="form-control" required>
        </div>
        <div class="form-group col-md-2">
          <label>Sexo<span class="text-danger">*</span></label>
          <select name="sexo" class="form-control" required>
            <option value="MASCULINO">Masculino</option>
            <option value="FEMININO">Feminino</option>
            <option value="OUTRO">Outro</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-2" id="group-dataNascimento">
          <label>Data de Nascimento<span class="text-danger" id="asterisk-dataNascimento">*</span></label>
          <input type="date" name="dataNascimento" class="form-control" id="dataNascimentoInput" required>
        </div>
        <div class="form-group col-md-3" id="group-cpf">
          <label>CPF<span class="text-danger" id="asterisk-cpf">*</span></label>
          <input type="text" name="cpf" class="form-control" id="cpfInput" required>
        </div>
        <div class="form-group col-md-3" id="group-identidade">
          <label>Identidade<span class="text-danger" id="asterisk-identidade">*</span></label>
          <input type="text" name="identidade" class="form-control" id="identidadeInput" required>
        </div>

        <div class="form-group col-md-4" id="crm-field" style="display:none;">
          <label>CRM<span class="text-danger" id="asterisk-crm" style="display: none;">*</span></label>
          <input type="text" name="crm" class="form-control" id="crmInput">
        </div>
        <div class="form-group col-md-4" id="oab-field" style="display:none;">
          <label>OAB<span class="text-danger" id="asterisk-oab" style="display: none;">*</span></label>
          <input type="text" name="oab" class="form-control" id="oabInput">
        </div>
      </div>

      <hr>
      <h6><i class="fas fa-map-marker-alt mr-2"></i> Endereço (opcional)</h6>

      <div class="form-row">
        <div class="form-group col-md-4">
          <label>CEP</label>
          <div class="input-group">
            <input type="text" class="form-control" th:field="*{enderecos[0].cep}" id="cep">
            <div class="input-group-append">
              <button class="btn btn-outline-secondary" type="button" onclick="buscarCep()">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-group col-md-4">
          <label>Logradouro</label>
          <input type="text" th:field="*{enderecos[0].logradouro}" class="form-control" id="logradouro" readonly>
        </div>

        <div class="form-group col-md-2">
          <label>Número</label>
          <input type="text" th:field="*{enderecos[0].numero}" class="form-control">
        </div>

        <div class="form-group col-md-2">
          <label>Complemento</label>
          <input type="text" th:field="*{enderecos[0].complemento}" class="form-control" id="complemento">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-4">
          <label>Bairro</label>
          <input type="text" th:field="*{enderecos[0].bairro}" class="form-control" id="bairro" readonly>
        </div>
        <div class="form-group col-md-4">
          <label>Cidade</label>
          <input type="text" th:field="*{enderecos[0].cidade}" class="form-control" id="cidade" readonly>
        </div>
        <div class="form-group col-md-4">
          <label>Estado</label>
          <input type="text" th:field="*{enderecos[0].estado}" class="form-control" id="estado" readonly>
        </div>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-primary btn-salvar-custom mt-3 shadow-sm">
          <i class="fas fa-save mr-1"></i> Salvar
        </button>
      </div>
    </form>
  </div>
</div>




<th:block th:replace="~{fragments/foot :: bot}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

<script th:inline="javascript">
  // --- FUNÇÕES JAVASCRIPT EXISTENTES ---

  // Validação do Bootstrap para exibir mensagens de erro
  (function () {
    'use strict';
    window.addEventListener('load', function () {
      var forms = document.getElementsByClassName('needs-validation');
      Array.prototype.filter.call(forms, function (form) {
        form.addEventListener('submit', function (event) {
          if (form.checkValidity() === false) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      });
    }, false);
  })();

  // Função para adicionar endereço (mantida como está no seu código)
  let enderecoIndex = 1;
  function adicionarEndereco() {
    const container = document.getElementById('enderecos-container');

    const novoEndereco = document.createElement('div');
    novoEndereco.className = "endereco-row border rounded p-3 mb-3";
    novoEndereco.innerHTML = `
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label>Logradouro</label>
                    <input type="text" name="enderecos[${enderecoIndex}].logradouro" class="form-control">
                </div>
                <div class="form-group col-md-2">
                    <label>Número</label>
                    <input type="text" name="enderecos[${enderecoIndex}].numero" class="form-control">
                </div>
                <div class="form-group col-md-3">
                    <label>Bairro</label>
                    <input type="text" name="enderecos[${enderecoIndex}].bairro" class="form-control">
                </div>
                <div class="form-group col-md-3">
                    <label>Complemento</label>
                    <input type="text" name="enderecos[${enderecoIndex}].complemento" class="form-control">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-md-4">
                    <label>Cidade</label>
                    <input type="text" name="enderecos[${enderecoIndex}].cidade" class="form-control">
                </div>
                <div class="form-group col-md-4">
                    <label>Estado</label>
                    <input type="text" name="enderecos[${enderecoIndex}].estado" class="form-control">
                </div>
                <div class="form-group col-md-4">
                    <label>CEP</label>
                    <input type="text" name="enderecos[${enderecoIndex}].cep" class="form-control">
                </div>
            </div>
        `;
    container.appendChild(novoEndereco);
    enderecoIndex++;
  }

  /**
   * Função principal para gerenciar a visibilidade e obrigatoriedade dos campos
   * com base no Tipo de pessoa selecionado.
   */
  /**
   * ATUALIZADO: Gerencia a obrigatoriedade dos campos com base no Tipo,
   * mas mantém todos os campos sempre visíveis.
   */
  function toggleFields() {
    const tipo = document.getElementById('tipo').value;

    // --- Referências aos Elementos ---
    // Inputs
    const dataNascimentoInput = document.getElementById('dataNascimentoInput');
    const cpfInput = document.getElementById('cpfInput');
    const identidadeInput = document.getElementById('identidadeInput');
    const crmInput = document.getElementById('crmInput');
    const oabInput = document.getElementById('oabInput');

    // Asteriscos de obrigatoriedade
    const asteriskDataNascimento = document.getElementById('asterisk-dataNascimento');
    const asteriskCpf = document.getElementById('asterisk-cpf');
    const asteriskIdentidade = document.getElementById('asterisk-identidade');
    const asteriskCrm = document.getElementById('asterisk-crm');
    const asteriskOab = document.getElementById('asterisk-oab');

    // Divs dos campos profissionais
    const crmField = document.getElementById('crm-field');
    const oabField = document.getElementById('oab-field');

    // --- Lógica Condicional ---

    // 1. Estado Padrão (para PACIENTE)
    // Define campos de paciente como obrigatórios e exibe seus asteriscos
    dataNascimentoInput.setAttribute('required', 'required');
    cpfInput.setAttribute('required', 'required');
    identidadeInput.setAttribute('required', 'required');
    asteriskDataNascimento.style.display = 'inline';
    asteriskCpf.style.display = 'inline';
    asteriskIdentidade.style.display = 'inline';

    // Esconde campos profissionais
    crmField.style.display = 'none';
    crmInput.removeAttribute('required');
    asteriskCrm.style.display = 'none';
    oabField.style.display = 'none';
    oabInput.removeAttribute('required');
    asteriskOab.style.display = 'none';

    // Limpa valores profissionais
    crmInput.value = '';
    oabInput.value = '';

    // 2. Ajustes para ADVOGADO ou MÉDICO
    if (tipo === 'ADVOGADO' || tipo === 'MEDICO') {
      // Define campos de paciente como OPCIONAIS e esconde seus asteriscos
      dataNascimentoInput.removeAttribute('required');
      cpfInput.removeAttribute('required');
      identidadeInput.removeAttribute('required');
      asteriskDataNascimento.style.display = 'none';
      asteriskCpf.style.display = 'none';
      asteriskIdentidade.style.display = 'none';

      // Mostra o campo profissional correspondente e o torna obrigatório
      if (tipo === 'ADVOGADO') {
        oabField.style.display = 'block';
        oabInput.setAttribute('required', 'required');
        asteriskOab.style.display = 'inline';
      } else { // MÉDICO
        crmField.style.display = 'block';
        crmInput.setAttribute('required', 'required');
        asteriskCrm.style.display = 'inline';
      }
    }
  }

  // Chama a função ao carregar a página
  document.addEventListener('DOMContentLoaded', toggleFields);

  // Função para buscar CEP (sem alterações)
  function buscarCep() {
    const cep = document.getElementById("cep").value.replace(/\D/g, '');
    if (cep.length !== 8) {
      Swal.fire("CEP inválido", "Digite um CEP com 8 números.", "warning");
      return;
    }
    fetch(`/api/cep/${cep}`)
      .then(response => {
        if (!response.ok) throw new Error("CEP não encontrado");
        return response.json();
      })
      .then(data => {
        document.getElementById("logradouro").value = data.logradouro || '';
        document.getElementById("bairro").value = data.bairro || '';
        document.getElementById("cidade").value = data.localidade || '';
        document.getElementById("estado").value = data.uf || '';
        document.getElementById("complemento").value = data.complemento || '';
      })
      .catch(error => {
        Swal.fire("Erro", "Não foi possível buscar o CEP.", "error");
      });
  }

  // Função de validação e alerta (sem alterações, já funciona com a nova lógica)
  function showSweetAlert() {
    var form = document.querySelector('.needs-validation');

    if (form.checkValidity() === false) {
      form.classList.add('was-validated');
      return false;
    }
    const tipo = document.getElementById('tipo').value;
    if (tipo === 'PACIENTE') {
      const dataNascimentoInput = document.getElementById('dataNascimentoInput');
      const dataNascimento = new Date(dataNascimentoInput.value);
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      if (dataNascimento > hoje) {
        Swal.fire('Erro de Validação!', 'A Data de Nascimento não pode ser no futuro.', 'error');
        dataNascimentoInput.focus();
        return false;
      }
      const cpfInput = $('#cpfInput');
      if (!cpfInput.val().match(/^\d{3}\.\d{3}\.\d{3}-\d{2}$/)) {
        Swal.fire('Erro de Validação!', 'Por favor, preencha o CPF corretamente.', 'error');
        cpfInput.focus();
        return false;
      }
      const identidadeInput = $('#identidadeInput');
      if (identidadeInput.val().replace(/\D/g, '').length < 8) {
        Swal.fire('Erro de Validação!', 'A Identidade (RG) deve ter no mínimo 8 dígitos.', 'error');
        identidadeInput.focus();
        return false;
      }
    }
    
    Swal.fire({
      icon: 'success',
      title: 'Cadastrado com Sucesso!',
      text: 'A pessoa foi registrada no sistema.',
      showConfirmButton: false,
      timer: 2000
    });
    return true;
  }

  // Aplicação das máscaras (sem alterações)
  $(document).ready(function () {
    $('#cpfInput').mask('000.000.000-00');
    $('#identidadeInput').mask('00.000.000-0', { reverse: true });
    $('#cep').mask('00000-000');
  });

</script>

</html>
