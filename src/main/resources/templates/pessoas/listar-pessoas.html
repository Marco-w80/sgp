<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<th:block th:replace="~{fragments/head :: top}"></th:block>

<style>
  /* Estilo para arredondar as bordas da tabela */
  .table-rounded-corners {
    border-collapse: separate;
    /* Necessário para border-radius em tabelas */
    border-spacing: 0;
    /* Remove espaçamento entre células para bordas contínuas */
    border-radius: .5rem;
    /* Ajuste o valor para o quão arredondado você quer */
    overflow: hidden;
    /* Garante que o conteúdo não vaze das bordas arredondadas */
  }

  /* Estilo para o cabeçalho da tabela */
  .table-rounded-corners thead {
    background-color: #e2e6ea;
    /* Um cinza claro e elegante */
    /* Ou, se preferir um azul mais próximo do primário do Bootstrap: */
    /* background-color: #dee2e6; */
    /* Um cinza um pouco mais escuro */
    /* background-color: #cfe2ff; */
    /* Um azul bem clarinho */
    color: #343a40;
    /* Cor do texto mais escura para contraste */
    /* Você pode usar text-primary do bootstrap se quiser o azul */
    /* color: #007bff; */
  }

  /* Centralizar o conteúdo das células do cabeçalho */
  .table-rounded-corners th {
    text-align: center;
    vertical-align: middle;
    /* Alinha verticalmente no meio */
  }

  /* Centralizar o conteúdo das células do corpo (revertido para o comportamento anterior, mas mantendo o vertical-align) */
  .table-rounded-corners td {
    text-align: center;
    /* Mantém a centralização horizontal para texto */
    vertical-align: middle;
    /* Alinha verticalmente no meio */
  }

  /* Garante que o TD da coluna de ações tenha altura suficiente para o flexbox */
  .table-rounded-corners td.d-flex {
    height: 100%;
    /* Permite que a célula se expanda para a altura da linha */
    box-sizing: border-box;
    /* Inclui padding e bordas no cálculo da largura/altura */
  }

  /* Garante que os ícones dentro dos botões sejam centralizados */
  .btn-circle i {
    display: block;
    /* Para que o ícone se comporte como um bloco dentro do flex do botão */
  }

  /* Estilo para botões circulares */
  .btn-circle {
    width: 35px;
    /* Define a largura */
    height: 35px;
    /* Define a altura */
    padding: 0;
    /* Remove o padding padrão */
    border-radius: 50%;
    /* Transforma em círculo */
    display: flex;
    /* Permite centralizar conteúdo com flexbox */
    align-items: center;
    /* Centraliza verticalmente */
    justify-content: center;
    /* Centraliza horizontalmente */
    flex-shrink: 0;
    /* Evita que o botão encolha */
  }

  /* Ajuste para botões pequenos circulares */
  .btn-circle.btn-sm {
    width: 30px;
    /* Tamanho um pouco menor para 'btn-sm' */
    height: 30px;
    font-size: 0.8rem;
    /* Ajusta o tamanho da fonte do ícone, se necessário */
  }
</style>

<div class="card shadow mb-5 rounded">
  <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-users mr-2"></i> Pessoas Cadastradas
    </h6>
    <a th:href="@{/pessoas/cadastrar}" class="btn btn-primary shadow-sm">
      <i class="fas fa-user-plus mr-1"></i> Cadastrar Nova Pessoa
    </a>
  </div>

  <div class="card-body">
    <div class="table-responsive">
      <table id="tabelaPessoas" class="table table-bordered table-hover w-100 table-rounded-corners" cellspacing="0">
        <thead class="thead-light">
          <tr>
            <th class="text-center">ID</th>
            <th class="text-center">Nome</th>
            <th class="text-center">Tipo</th>
            <th class="text-center">Sexo</th>
            <th class="text-center">Data Nascimento</th>
            <th class="text-center">CPF</th>
            <th class="text-center">Identidade</th>
            <th class="text-center">CRM / OAB</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${pessoas}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nome}"></td>
            <td th:text="${p.tipo}"></td>
            <td th:text="${p.sexo}"></td>
            <td th:text="${#temporals.format(p.dataNascimento,'dd/MM/yyyy')}"></td>
            <td th:text="${p.cpf}"></td>
            <td th:text="${p.identidade}"></td>
            <td th:text="${p.documentoEspecial}"></td>
            <td class="d-flex justify-content-center align-items-center">
              <a th:href="@{|/pessoas/editar/${p.id}|}" class="btn btn-circle btn-sm btn-secondary" title="Editar">
                <i class="fas fa-edit"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<th:block th:replace="~{fragments/foot :: bot}"></th:block>

<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
