<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Lista de Hospitais</title>
  <th:block th:replace="~{fragments/head :: top}"></th:block>

  <style>
    /* Estilo para arredondar as bordas da tabela */
    .table-rounded-corners {
      border-collapse: separate;
      border-spacing: 0;
      border-radius: .5rem;
      overflow: hidden;
    }

    /* Estilo para o cabeçalho da tabela */
    .table-rounded-corners thead {
      background-color: #e2e6ea;
      color: #343a40;
    }

    /* Alinhamento vertical no meio para cabeçalhos */
    .table-rounded-corners th {
      vertical-align: middle;
      text-align: center;
    }

    /* Centralizar o conteúdo das células do corpo (geral para texto) */
    .table-rounded-corners td {
      text-align: center;
      vertical-align: middle;
    }

    /* Estilo para botões circulares */
    .btn-circle {
      width: 35px;
      height: 35px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Ajuste para botões pequenos circulares */
    .btn-circle.btn-sm {
      width: 30px;
      height: 30px;
      font-size: 0.8rem;
    }

    /* Garante que o TD da coluna de ações tenha altura suficiente para o flexbox e centralize seu conteúdo */
    .table-rounded-corners td.actions-column {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      box-sizing: border-box;
    }

    /* Garante que os ícones dentro dos botões sejam centralizados */
    .btn-circle i {
      display: block;
    }
  </style>
</head>

<body>
  <div class="card shadow mb-4 rounded">
    <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-hospital mr-2"></i> Hospitais Cadastrados
      </h6>
      <a class="btn btn-primary shadow-sm" th:href="@{/hospitais/cadastrar}">
        <i class="fas fa-plus mr-1"></i> Novo Hospital
      </a>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table id="tabelaHospitais" class="table table-bordered table-hover w-100 table-rounded-corners"
          cellspacing="0">
          <thead class="thead-light">
            <tr>
              <th class="text-center">ID</th>
              <th class="text-center">Nome</th>
              <th class="text-center">CNPJ</th>
              <th class="text-center">Endereço</th>
              <th class="text-center">Telefone</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="h : ${hospitais}">
              <td th:text="${h.id}"></td>
              <td th:text="${h.nome}"></td>
              <td th:text="${h.cnpj}"></td>
              <td th:text="${h.endereco}"></td>
              <td th:text="${h.telefone}"></td>
              <td class="actions-column">
                <a th:href="@{'/hospitais/editar/' + ${h.id}}" class="btn btn-circle btn-sm btn-secondary shadow-sm"
                  title="Editar">
                  <i class="fas fa-edit"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/foot :: bot}"></th:block>

  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
