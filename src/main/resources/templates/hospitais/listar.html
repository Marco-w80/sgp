<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Lista de Hospitais</title>
  <th:block th:replace="~{fragments/head :: top}"></th:block>

  <style>
    /* ==========================================================================
       1. PALETA DE CORES E TEMA GLOBAL (PADRÃO DO SISTEMA)
       ========================================================================== */
    :root {
      --cor-primaria: #166298;
      --cor-secundaria: #192f51;
      --cor-fundo-claro: #f8f9fc;
      --cor-texto-escuro: #5a5c69;
      --cor-borda-suave: #e3e6f0;
      --cor-fundo-hover: #f1f3f8;
    }

    body {
      background-color: #f1f5f9;
      color: var(--cor-texto-escuro);
    }

    /* ==========================================================================
       2. CARD PRINCIPAL E CABEÇALHO
       ========================================================================== */
    .card.shadow {
      border: none;
      border-radius: 0.75rem;
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.07) !important;
    }

    .card-header {
      background-color: var(--cor-fundo-claro);
      border-bottom: 2px solid var(--cor-primaria);
      padding: 1rem 1.5rem;
      border-top-left-radius: 0.75rem;
      border-top-right-radius: 0.75rem;
    }

    .card-header h6 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--cor-primaria) !important;
    }

    .card-body-table {
      padding: 0 !important;
    }

    /* ==========================================================================
       3. BOTÕES (GERAL, PRIMÁRIO E OUTLINE CIRCULAR)
       ========================================================================== */
    .btn {
      font-weight: 600 !important;
      transition: all 0.2s ease-in-out !important;
      border-radius: 0.375rem;
    }

    .btn:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12) !important;
    }

    .btn-primary { background-color: var(--cor-primaria) !important; border-color: var(--cor-primaria) !important; color: white !important; }
    .btn-primary:hover { background-color: var(--cor-secundaria) !important; border-color: var(--cor-secundaria) !important; }

    .btn-outline-primary {
      background-color: transparent !important;
      border: 1px solid var(--cor-primaria) !important;
      color: var(--cor-primaria) !important;
    }

    .btn-outline-primary:hover {
      background-color: var(--cor-primaria) !important;
      color: white !important;
    }

    .btn-circle {
      width: 35px; height: 35px; padding: 0; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    .btn-circle.btn-sm { width: 32px; height: 32px; font-size: 0.8rem; }

    /* ==========================================================================
       4. TABELA ELEGANTE, SCROLL ISOLADO E CANTOS ARREDONDADOS
       ========================================================================== */
    .table-container {
      border-radius: 0 0 0.75rem 0.75rem !important;
      background-color: #fff !important;
      padding-bottom: 0.5rem;
      overflow: visible !important; 
    }

    /* Scroll apenas na tabela (ignora pesquisa e paginação) */
    .dataTables_wrapper > .row:nth-child(2) > .col-sm-12 {
      overflow-x: auto !important;
      overflow-y: visible !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    .dataTables_wrapper > .row:nth-child(2) { margin-left: 0 !important; margin-right: 0 !important; }
    .dataTables_wrapper > .row:nth-child(3) { padding-top: 1rem !important; }

    .table {
      border: 1px solid var(--cor-borda-suave) !important;
      width: 100% !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      background-color: #fff !important;
      margin-bottom: 0 !important;
      position: relative;
    }

    /* Cantos arredondados das células */
    .table thead:first-child tr:first-child th:first-child { border-top-left-radius: 0.75rem !important; }
    .table thead:first-child tr:first-child th:last-child { border-top-right-radius: 0.75rem !important; }
    .table tbody:last-of-type tr:last-child td:first-child { border-bottom-left-radius: 0.75rem !important; }
    .table tbody:last-of-type tr:last-child td:last-child { border-bottom-right-radius: 0.75rem !important; }

    /* Ajuste de bordas internas verticais */
    .table th, .table td {
      border-left: none !important;
      border-right: 1px solid var(--cor-borda-suave) !important;
    }
    .table th:last-child, .table td:last-child { border-right: none !important; }

    .table th {
      color: var(--cor-secundaria) !important;
      font-weight: 700 !important;
      text-align: center !important;
      vertical-align: middle !important;
      padding: 1rem 0.75rem !important;
      text-transform: uppercase !important;
      font-size: 0.75rem !important;
      letter-spacing: 0.04em !important;
      border-bottom: 2px solid var(--cor-borda-suave) !important;
      border-top: none !important;
      background-color: var(--cor-fundo-claro) !important;
      word-break: break-word;
      white-space: nowrap !important;
    }

    .table td {
      text-align: center !important;
      vertical-align: middle !important;
      padding: 0.75rem !important;
      border-top: 1px solid var(--cor-borda-suave) !important;
      color: var(--cor-texto-escuro) !important;
      background-color: #fff !important;
      font-size: 0.85rem;
    }

    .table tbody tr:hover td { background-color: var(--cor-fundo-hover) !important; transition: background-color 0.2s ease-in-out !important; }

    /* ==========================================================================
       5. LARGURAS, TRUNCATE E COLUNA FIXA (STICKY)
       ========================================================================== */
    .truncate {
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }

    /* Colunas que precisam de mais espaço na rolagem */
    .col-endereco { min-width: 250px; }
    .col-cnpj { min-width: 140px; }

    /* MÁGICA DA COLUNA FIXA */
    .col-acoes-fixa {
      position: sticky !important;
      right: 0;
      z-index: 1;
      background-color: #fff !important;
      box-shadow: -4px 0 8px rgba(0, 0, 0, 0.04);
      min-width: 80px; 
    }
    
    .table thead th.col-acoes-fixa {
      background-color: var(--cor-fundo-claro) !important;
      z-index: 2 !important;
    }
    
    .table tbody tr:hover .col-acoes-fixa {
      background-color: var(--cor-fundo-hover) !important;
    }

    /* ==========================================================================
       6. DATATABLES ESTILIZADO
       ========================================================================== */
    div.dataTables_wrapper { padding: 1.5rem !important; font-size: 0.9rem !important; }
    div.dataTables_wrapper label { font-weight: 600 !important; font-size: 0.9rem !important; color: var(--cor-secundaria) !important; margin-bottom: 0.5rem !important; display: inline-block !important; }
    .dataTables_wrapper .dataTables_length select { width: auto !important; min-width: 60px !important; }
    div.dataTables_wrapper .dataTables_length select, div.dataTables_wrapper .dataTables_filter input {
      border-radius: 0.5rem !important; border: 1px solid var(--cor-borda-suave) !important; padding: 0.45rem 0.75rem !important;
      font-size: 0.875rem !important; transition: border-color 0.3s ease, box-shadow 0.3s ease !important; background-color: #fff !important;
    }
    div.dataTables_wrapper .dataTables_length select:focus, div.dataTables_wrapper .dataTables_filter input:focus {
      border-color: var(--cor-primaria) !important; box-shadow: 0 0 0 0.2rem rgba(22, 98, 152, 0.25) !important; outline: none !important;
    }
    .dataTables_wrapper .pagination .page-link {
      color: var(--cor-primaria) !important; background-color: #f1f5f9 !important; border: 1px solid var(--cor-borda-suave) !important;
      border-radius: 0.375rem !important; transition: all 0.2s ease-in-out !important; padding: 0.45rem 0.8rem !important; margin: 0 0.15rem !important;
    }
    .dataTables_wrapper .pagination .page-link:hover { background-color: var(--cor-primaria) !important; color: #fff !important; border-color: var(--cor-primaria) !important; }
    .dataTables_wrapper .pagination .page-item.active .page-link {
      background-color: var(--cor-primaria) !important; border-color: var(--cor-primaria) !important; color: #fff !important; font-weight: bold !important; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12) !important;
    }
  </style>
</head>

<body>
  <div class="card shadow mb-5 rounded">
    
    <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-hospital mr-2"></i> Hospitais Cadastrados
      </h6>
      <a class="btn btn-primary shadow-sm" th:href="@{/hospitais/cadastrar}">
        <i class="fas fa-plus mr-1"></i> Novo Hospital
      </a>
    </div>
    
    <div class="card-body card-body-table">
      
      <div class="table-container">
        <table id="tabelaHospitais" class="table table-hover w-100" cellspacing="0">
          <thead>
            <tr>
              <th style="width: 5%;">ID</th>
              <th>Nome</th>
              <th class="col-cnpj">CNPJ</th>
              <th class="col-endereco">Endereço</th>
              <th>Telefone</th>
              <th class="no-sort col-acoes-fixa">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="h : ${hospitais}">
              <td class="truncate" th:text="${h.id}"></td>
              <td class="truncate font-weight-bold" style="color: var(--cor-secundaria);" th:text="${h.nome}"></td>
              <td class="truncate col-cnpj" th:text="${h.cnpj}"></td>
              <td class="truncate col-endereco" th:text="${h.endereco}"></td>
              <td class="truncate" th:text="${h.telefone}"></td>
              <td class="col-acoes-fixa">
                <div class="d-flex justify-content-center">
                  <a th:href="@{'/hospitais/editar/' + ${h.id}}" class="btn btn-circle btn-sm btn-outline-primary shadow-sm" title="Editar">
                    <i class="fas fa-edit"></i>
                  </a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <th:block th:replace="~{fragments/foot :: bot}"></th:block>

  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    $(document).ready(function () {
      
      const langUrl = '/datatables/i18n/pt-BR.json';

      var table = $('#tabelaHospitais').DataTable({
        language: { url: langUrl },
        pageLength: 10,
        lengthMenu: [5, 10, 25, 50],
        /* Removemos o scrollX: true para não quebrar nosso layout nativo arredondado */
        columnDefs: [
          { orderable: false, targets: 'no-sort' } // Identifica as colunas dinamicamente
        ]
      });

      // Lógica de Tooltips (Truncate)
      function addTooltipsToTruncatedCells() {
        table.cells('.truncate').nodes().each(function (cell) {
          var $cell = $(cell);
          if (cell.scrollWidth > $cell.innerWidth()) {
            $cell.attr('title', $cell.text());
          } else {
            $cell.removeAttr('title');
          }
        });
      }

      table.on('draw.dt', function () {
        addTooltipsToTruncatedCells();
      });
      setTimeout(addTooltipsToTruncatedCells, 500);

      // Função de exclusão comentada mantida igual ao original
      /*
      window.confirmarExclusaoHospital = function(id) { ... }
      */
    });
  </script>
</body>

</html>
