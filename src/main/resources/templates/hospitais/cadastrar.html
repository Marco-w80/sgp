<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:replace="~{fragments/head :: top}"></head>
<body>

<div class="card shadow mb-4">
  <div class="card-header py-3">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-hospital mr-2"></i> Cadastrar Hospital
    </h6>
  </div>

  <div class="card-body">
    <form th:action="@{/hospitais/cadastrar}" method="post" th:object="${hospital}">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" th:field="*{nome}" id="nome" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="cnpj">CNPJ</label>
        <input type="text" th:field="*{cnpj}" id="cnpj" class="form-control">
      </div>

      <div class="form-group">
        <label for="endereco">Endereço</label>
        <input type="text" th:field="*{endereco}" id="endereco" class="form-control">
      </div>

      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="text" th:field="*{telefone}" id="telefone" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary">Salvar</button>
      <a th:href="@{/hospitais}" class="btn btn-secondary ml-2">Cancelar</a>
    </form>
  </div>
</div>

<div th:replace="~{fragments/foot :: bot}"></div>
</body>
</html>
