<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Login - SGP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap e FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Estilo personalizado -->
  <style>
    :root {
      --primary-color: #166298;
      --secondary-color: #192f51;
      --white-color: #ffffff;
    }

    body {
      background: var(--secondary-color);
      padding: 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container img {
      max-width: 300px;
      height: auto;
    }

    .login-card {
      background-color: var(--white-color);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .login-card h2 {
      color: var(--secondary-color);
      font-weight: 600;
    }

    .form-label {
      font-weight: 500;
      color: var(--secondary-color);
      text-align: left;
    }

    .input-group-text {
      background-color: #f8f9fa;
      border-right: 0;
    }

    .form-control {
      border-left: 0;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: none;
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      font-weight: 500;
    }

    .btn-primary:hover {
      background-color: #134f7b;
      border-color: #134f7b;
    }

    .error-message {
      color: #dc3545;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
  </style>
</head>

<body>

  <!-- Logo fora da caixa -->
  <div class="logo-container mb-5">
    <img src="/img/logo-branca.png" alt="Logo SGP">
  </div>

  <!-- Caixa de login -->
  <div class="login-card">
    <h2 class="mb-2">Bem-vindo ao SGP</h2>
    <p class="text-muted mb-4">Acesso restrito à intranet</p>

    <form th:action="@{/login}" method="post">
      <div class="mb-3 text-start">
        <label class="form-label">E-mail</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="email" name="username" class="form-control" placeholder="Digite seu e-mail" required>
        </div>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label">Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Digite sua senha" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>

      <div th:if="${param.error}" class="error-message">Login inválido</div>
    </form>
  </div>

</body>

</html>
