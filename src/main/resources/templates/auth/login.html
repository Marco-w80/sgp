<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login - SGP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #0D1B2A, #1B263B);
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.1);
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #0077B6;
        }

        .btn-primary {
            background-color: #0077B6;
            border-color: #0077B6;
        }

        .btn-primary:hover {
            background-color: #005f8a;
            border-color: #005f8a;
        }

        .input-group-text {
            background-color: #f0f0f0;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="login-card bg-white p-4">
        <h2 class="mb-2 text-center text-dark">Bem-vindo ao SGP</h2>
        <p class="text-center text-muted mb-4">Acesso restrito à intranet</p>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="username" class="form-control" placeholder="Digite seu e-mail" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Digite sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Entrar</button>

            <div th:if="${param.error}" class="text-danger mt-3 text-center">Login inválido</div>
        </form>

        <!-- <div class="text-center mt-3">
            <a th:href="@{/register}">Criar conta</a>
        </div> -->
    </div>

</body>

</html>
