<head>
  <title>Gerenciar Tumores por Localização</title>
  <div th:replace="~{fragments/head :: top}"></div>
</head>

<div class="card shadow mb-4">
  <div class="card-header py-3">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-brain mr-2"></i> Gerenciar Tumores por Localização
    </h6>
  </div>

  <div class="card-body">
    <form method="get" th:action="@{/doencas/cadastrar}">
      <div class="form-group">
        <label for="grupoSelect">Selecione uma Localização:</label>
        <select class="form-control" id="grupoSelect" name="grupoId" onchange="this.form.submit()">
          <option value="">-- Escolha a Localização --</option>
          <option th:each="grupo : ${grupos}" th:value="${grupo.id}"
            th:selected="${grupoSelecionado != null and grupoSelecionado.id == grupo.id}" th:text="${grupo.nome}">
          </option>
        </select>
      </div>
    </form>

    <hr class="mt-4 mb-4" th:if="${grupoSelecionado != null}">

    <div th:if="${grupoSelecionado != null}">
      <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
          <h6 class="m-0 font-weight-bold text-primary">
            <i class="fas fa-map-marker-alt mr-2"></i> Localização Selecionada: <span
              th:text="${grupoSelecionado.nome}"></span>
          </h6>
          <button class="btn btn-success btn-sm" data-toggle="modal" data-target="#novoModal">
            <i class="fas fa-plus mr-1"></i> Novo Tipo de Tumor
          </button>
        </div>

        <div class="card-body">
          <h5 class="mb-3">Tipos de Tumor Cadastrados:</h5>
          <ul class="list-group mb-4">
            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="d : ${doencas}">
              <span th:text="${d.nome}"></span>
              <button class="btn btn-sm btn-outline-secondary" data-toggle="modal"
                th:attr="data-target='#editModal_' + ${d.id}">
                <i class="fas fa-edit"></i> Editar
              </button>

              <div class="modal fade" th:id="'editModal_' + ${d.id}" tabindex="-1" role="dialog"
                aria-labelledby="editModalLabel" aria-hidden="true">
                <div class="modal-dialog" role="document">
                  <div class="modal-content">
                    <form th:action="@{/doencas/editar}" method="post">
                      <input type="hidden" name="id" th:value="${d.id}" />
                      <input type="hidden" name="grupoId" th:value="${grupoSelecionado.id}" />
                      <div class="modal-header">
                        <h5 class="modal-title" th:id="'editModalLabel_' + ${d.id}">Editar Tipo de Tumor</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                          <span aria-hidden="true">&times;</span>
                        </button>
                      </div>
                      <div class="modal-body">
                        <div class="form-group">
                          <label for="nomeEdit_[[${d.id}]]">Nome do Tipo de Tumor:</label>
                          <input type="text" class="form-control" th:id="'nomeEdit_' + ${d.id}" name="nome"
                            th:value="${d.nome}" required />
                        </div>
                      </div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </li>
            <li class="list-group-item text-muted" th:if="${doencas == null or doencas.isEmpty()}">
              Nenhum tipo de tumor cadastrado para esta localização.
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="novoModal" tabindex="-1" role="dialog" aria-labelledby="novoModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form th:action="@{/doencas/cadastrar}" method="post">
        <input type="hidden" name="grupoId" th:value="${grupoSelecionado != null ? grupoSelecionado.id : ''}" />
        <div class="modal-header">
          <h5 class="modal-title" id="novoModalLabel">Novo Tipo de Tumor</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="nomeNovo">Nome do Tipo de Tumor:</label>
            <input type="text" class="form-control" id="nomeNovo" name="nome" placeholder="Digite o tipo de tumor"
              required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{fragments/foot :: bot}"></div>

</html>
