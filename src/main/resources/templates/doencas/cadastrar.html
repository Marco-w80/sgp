<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Gerenciar Tumores por Localização</title>
  <th:block th:replace="~{fragments/head :: top}"></th:block>

  <style>
    /* ==========================================================================
     1. VARIÁVEIS DE COR E ESTILOS GERAIS
     ========================================================================== */
    :root {
      --cor-primaria: #166298;
      --cor-secundaria: #192f51;
      --cor-fundo-claro: #f8f9fc;
      --cor-texto-escuro: #5a5c69;
      --cor-borda-suave: #e3e6f0;
      --cor-fundo-hover: #f1f3f8;
    }

    /* ==========================================================================
     2. PADRÃO PARA CABEÇALHOS E FILTROS
     ========================================================================== */
    .card-header.form-header {
      background-color: var(--cor-fundo-claro);
      border-bottom: 2px solid var(--cor-primaria);
    }

    .form-header .font-weight-bold {
      color: var(--cor-primaria) !important;
      font-size: 1.1rem;
    }

    #grupoSelect:focus {
      border-color: var(--cor-primaria);
      box-shadow: 0 0 0 0.2rem rgba(22, 98, 152, 0.25);
    }

    #grupoSelect,
    .form-group>label {
      color: var(--cor-secundaria);
    }

    /* ==========================================================================
     3. LISTA DE GERENCIAMENTO (List Group)
     ========================================================================== */
    .list-group {
      border: 1px solid var(--cor-borda-suave) !important;
      border-radius: .5rem;
      overflow: hidden;
    }

    .list-group-item {
      transition: background-color 0.2s ease-in-out;
      border-color: var(--cor-borda-suave) !important;
    }

    .list-group-item:not(.text-muted):hover {
      background-color: var(--cor-fundo-hover);
      cursor: pointer;
    }

    .list-group-item>span {
      flex-grow: 1;
      margin-right: 1rem;
      word-break: break-word;
      color: var(--cor-texto-escuro);
      font-weight: 500;
    }

    /* ==========================================================================
     4. JANELAS MODAIS
     ========================================================================== */
    .modal-header {
      background-color: var(--cor-fundo-claro);
      border-bottom: 2px solid var(--cor-primaria);
    }

    .modal-title {
      color: var(--cor-primaria);
      font-weight: 700;
    }

    .modal-footer {
      background-color: var(--cor-fundo-claro);
      border-top: 1px solid var(--cor-borda-suave);
    }

    .modal-body label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--cor-secundaria);
    }

    .modal-body .form-control:focus {
      border-color: var(--cor-primaria);
      box-shadow: 0 0 0 0.2rem rgba(22, 98, 152, 0.25);
    }

    /* ==========================================================================
     5. BOTÕES
     ========================================================================== */
    .btn {
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1) !important;
    }

    .btn-primary {
      background-color: var(--cor-primaria);
      border-color: var(--cor-primaria);
    }

    .btn-primary:hover {
      background-color: var(--cor-secundaria);
      border-color: var(--cor-secundaria);
    }

    .btn-secondary {
      background-color: #858796;
      border-color: #858796;
    }

    .btn-secondary:hover {
      background-color: #707280;
      border-color: #696b78;
    }
  </style>
</head>

<body>

  <div class="card shadow mb-4 rounded">
    <div class="card-header py-3 form-header">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-brain mr-2"></i> Gerenciar Tumores por Localização
      </h6>
    </div>

    <div class="card-body">
      <form method="get" th:action="@{/doencas/cadastrar}">
        <div class="form-group">
          <label for="grupoSelect" class="font-weight-bold">Selecione uma Localização:</label>
          <select class="form-control" id="grupoSelect" name="grupoId" onchange="this.form.submit()">
            <option value="">-- Escolha a Localização --</option>
            <option th:each="grupo : ${grupos}" th:value="${grupo.id}"
              th:selected="${grupoSelecionado != null and grupoSelecionado.id == grupo.id}" th:text="${grupo.nome}">
            </option>
          </select>
        </div>
      </form>

      <hr class="mt-4 mb-4" th:if="${grupoSelecionado != null}">

      <div th:if="${grupoSelecionado != null}">
        <div class="card shadow mb-4 rounded">
          <div class="card-header py-3 d-flex justify-content-between align-items-center form-header">
            <h6 class="m-0 font-weight-bold text-primary">
              <i class="fas fa-map-marker-alt mr-2"></i> Localização Selecionada: <span
                th:text="${grupoSelecionado.nome}"></span>
            </h6>
            <button class="btn btn-primary btn-sm shadow-sm" data-toggle="modal" data-target="#novoModal">
              <i class="fas fa-plus mr-1"></i> Novo Tipo de Tumor
            </button>
          </div>

          <div class="card-body">
            <h5 class="mb-3">Tipos de Tumor Cadastrados:</h5>
            <ul class="list-group mb-4 rounded">
              <li class="list-group-item d-flex justify-content-between align-items-center" th:each="d : ${doencas}">
                <span th:text="${d.nome}"></span>
                <div class="btn-group">
                  <button class="btn btn-sm btn-secondary shadow-sm" data-toggle="modal"
                    th:attr="data-target='#editModal_' + ${d.id}">
                    <i class="fas fa-edit"></i> Editar
                  </button>
                </div>

                <div class="modal fade" th:id="'editModal_' + ${d.id}" tabindex="-1" role="dialog"
                  th:aria-labelledby="'editModalLabel_' + ${d.id}" aria-hidden="true">
                  <div class="modal-dialog" role="document">
                    <div class="modal-content">
                      <form th:action="@{/doencas/editar}" method="post" class="needs-validation" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="id" th:value="${d.id}" />
                        <input type="hidden" name="grupoId" th:value="${grupoSelecionado.id}" />
                        <div class="modal-header">
                          <h5 class="modal-title" th:id="'editModalLabel_' + ${d.id}">Editar Tipo de Tumor</h5>
                          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                          </button>
                        </div>
                        <div class="modal-body">
                          <div class="form-group">
                            <label th:for="'nomeEdit_' + ${d.id}">Nome do Tipo de Tumor<span
                                class="text-danger">*</span>:</label>
                            <input type="text" class="form-control" th:id="'nomeEdit_' + ${d.id}" name="nome"
                              th:value="${d.nome}" required />
                            <div class="invalid-feedback">
                              Por favor, insira o nome do tipo de tumor.
                            </div>
                          </div>
                        </div>
                        <div class="modal-footer">
                          <button type="button" class="btn btn-secondary shadow-sm" data-dismiss="modal">
                            <i class="fas fa-times-circle mr-1"></i> Cancelar
                          </button>
                          <button type="submit" class="btn btn-primary shadow-sm">
                            <i class="fas fa-save mr-1"></i> Salvar Alterações
                          </button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </li>
              <li class="list-group-item text-muted text-center" th:if="${doencas == null or doencas.isEmpty()}">
                Nenhum tipo de tumor cadastrado para esta localização.
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="novoModal" tabindex="-1" role="dialog" aria-labelledby="novoModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <form th:action="@{/doencas/cadastrar}" method="post" class="needs-validation" novalidate>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <input type="hidden" name="grupoId" th:value="${grupoSelecionado != null ? grupoSelecionado.id : ''}" />
          <div class="modal-header">
            <h5 class="modal-title" id="novoModalLabel">Novo Tipo de Tumor</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label for="nomeNovo">Nome do Tipo de Tumor<span class="text-danger">*</span>:</label>
              <input type="text" class="form-control" id="nomeNovo" name="nome" placeholder="Digite o tipo de tumor"
                required />
              <div class="invalid-feedback">
                Por favor, insira o nome do novo tipo de tumor.
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary shadow-sm" data-dismiss="modal">
              <i class="fas fa-times-circle mr-1"></i> Cancelar
            </button>
            <button type="submit" class="btn btn-primary shadow-sm">
              <i class="fas fa-plus-circle mr-1"></i> Cadastrar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/foot :: bot}"></th:block>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script th:inline="javascript">
    // Função para feedback com SweetAlert2 após operações de CRUD
    function showFeedback(icon, title, text) {
      Swal.fire({
        icon: icon,
        title: title,
        text: text,
        showConfirmButton: false,
        timer: 2000
      });
    }

    // Exemplo de como você chamaria isso do seu Controller (via Model ou Flash Attributes)
    /*
    // No seu Controller Spring:
    // Para sucesso no cadastro: model.addAttribute("successMessage", "Tipo de tumor cadastrado com sucesso!");
    // Para sucesso na edição: model.addAttribute("successMessage", "Tipo de tumor atualizado com sucesso!");
    // Para erro: model.addAttribute("errorMessage", "Erro ao cadastrar/atualizar tipo de tumor.");

    $(document).ready(function() {
        var successMessage = [[${successMessage}]];
        var errorMessage = [[${errorMessage}]];

        if (successMessage) {
            showFeedback('success', 'Sucesso!', successMessage);
        }
        if (errorMessage) {
            showFeedback('error', 'Erro!', errorMessage);
        }
    });
    */

    // Validação do Bootstrap para Modais (aplicar a todos os formulários .needs-validation)
    (function () {
      'use strict';
      window.addEventListener('load', function () {
        var forms = document.querySelectorAll('.needs-validation'); // Usa querySelectorAll
        Array.prototype.filter.call(forms, function (form) {
          form.addEventListener('submit', function (event) {
            if (form.checkValidity() === false) {
              event.preventDefault();
              event.stopPropagation();
              // Optional: Scroll to the first invalid field in the modal
              setTimeout(() => {
                const firstInvalid = form.querySelector('.is-invalid');
                if (firstInvalid) {
                  firstInvalid.focus();
                }
              }, 100);
            }
            form.classList.add('was-validated');
          }, false);
        });
      }, false);
    })();
  </script>
</body>

</html>
