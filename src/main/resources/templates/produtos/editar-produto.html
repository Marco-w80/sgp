<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Editar Produto</title>
  <div th:replace="~{fragments/head :: top}"></div>
</head>

<body>
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-box mr-2"></i> Editar Produto
      </h6>
    </div>

    <div class="card-body">
      <form th:action="@{|/produtos/editar/${produto.id}|}" th:object="${produto}" method="post">

        <fieldset class="form-group border p-3">
          <legend class="w-auto px-2">Dados Principais</legend>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="codigo">Código:</label>
              <input type="text" class="form-control" id="codigo" th:field="*{codigo}" required />
            </div>
            <div class="form-group col-md-8">
              <label for="nomeItem">Nome do Item:</label>
              <input type="text" class="form-control" id="nomeItem" th:field="*{nomeItem}" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="unidadeMedida">Unidade Medida:</label>
              <input type="text" class="form-control" id="unidadeMedida" th:field="*{unidadeMedida}" required />
            </div>
            <div class="form-group col-md-4">
              <label for="siglaUnidade">Sigla Unidade:</label>
              <input type="text" class="form-control" id="siglaUnidade" th:field="*{siglaUnidade}" required />
            </div>
            <div class="form-group col-md-4">
              <label for="grupo">Grupo:</label>
              <select class="form-control" id="grupo" th:field="*{grupo}" required>
                <option value="">Selecione...</option>
                <option th:each="g : ${grupos}" th:value="${g}" th:text="${g}" th:selected="${g == produto.grupo}">
                </option>
              </select>
            </div>
          </div>
        </fieldset>

        <fieldset class="form-group border p-3 mt-4">
          <legend class="w-auto px-2">Outros Detalhes</legend>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="fabricante">Fabricante:</label>
              <input type="text" class="form-control" id="fabricante" th:field="*{fabricante}" />
            </div>
            <div class="form-group col-md-6">
              <label for="modelo">Modelo:</label>
              <input type="text" class="form-control" id="modelo" th:field="*{modelo}" />
            </div>
          </div>
          <div class="form-group">
            <label for="especificacoes">Especificações:</label>
            <textarea class="form-control" id="especificacoes" th:field="*{especificacoes}" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="dataCadastro">Data Cadastro:</label>
            <input type="date" class="form-control" id="dataCadastro" name="dataCadastro"
              th:value="${produto.dataCadastro}" required readonly />
          </div>
        </fieldset>

        <hr class="mt-4 mb-4">

        <button type="submit" class="btn btn-primary">Atualizar</button>
        <a th:href="@{/produtos/listar}" class="btn btn-secondary ml-2">Cancelar</a>
      </form>
    </div>
  </div>

  <div th:replace="~{fragments/foot :: bot}"></div>
</body>

</html>
