<head>
  <title>Lista de Produtos</title>
  <div th:replace="~{fragments/head :: top}"></div>
</head>

<div class="card shadow mb-4">

  <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-boxes mr-2"></i> Produtos Cadastrados
    </h6>
    <a th:href="@{/produtos/cadastrar}" class="btn btn-primary">
      <i class="fas fa-box-open mr-1"></i> Cadastrar Novo Produto
    </a>
  </div>

  <div class="card-body">
    <div class="table-responsive">

      <table id="tabelaProdutos" class="table table-bordered table-hover" width="100%" cellspacing="0">
        <thead class="thead-light">
          <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Nome Item</th>
            <th>Unidade</th>
            <th>Sigla</th>
            <th>Grupo</th>
            <th>Data Cadastro</th>
            <th>Especificações</th>
            <th>Fabricante</th>
            <th>Modelo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="prod : ${produtos}">
            <td th:text="${prod.id}"></td>
            <td th:text="${prod.codigo}"></td>
            <td th:text="${prod.nomeItem}"></td>
            <td th:text="${prod.unidadeMedida}"></td>
            <td th:text="${prod.siglaUnidade}"></td>
            <td th:text="${prod.grupo}"></td>
            <td th:text="${prod.dataCadastro}"></td>
            <td th:text="${prod.especificacoes}"></td>
            <td th:text="${prod.fabricante}"></td>
            <td th:text="${prod.modelo}"></td>
            <td>
              <a th:href="@{|/produtos/editar/${prod.id}|}" class="btn btn-sm btn-secondary">
                <i class="fas fa-edit"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>

</div>

<div th:replace="~{fragments/foot :: bot}"></div>

<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>

<script>
  $(document).ready(function () {
    $('#tabelaProdutos').DataTable({
      language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
      pageLength: 10,
      lengthMenu: [5, 10, 25, 50]
    });
  });
</script>
