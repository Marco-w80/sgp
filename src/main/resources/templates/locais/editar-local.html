<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Editar Local</title>
  <th:block th:replace="~{fragments/head :: top}"></th:block>

  <style>
    /* ==========================================================================
     1. DEFINIÇÃO DE CORES E TEMAS
     ========================================================================== */
    :root {
      /* Cores Base */
      --cor-cadastro: #166298;
      /* Azul */
      --cor-cadastro-hover: #192f51;
      /* Azul Escuro */

      --cor-edicao: #4e5aa6;
      /* Roxo-azulado */
      --cor-edicao-hover: #3c447f;
      /* Roxo-azulado Escuro */

      --cor-sucesso: #1cc88a;
      --cor-perigo: #e74a3b;
      --cor-fundo-claro: #f8f9fc;
      --cor-texto-escuro: #5a5c69;
      --cor-borda-suave: #e3e6f0;

      /* --- Variáveis de Tema Ativo (Padrão é Cadastro) --- */
      --cor-primaria-ativa: var(--cor-cadastro);
      --cor-hover-ativa: var(--cor-cadastro-hover);
    }

    /* --- SELETOR DE TEMA: Ativa o tema de edição --- */
    .pagina-edicao {
      --cor-primaria-ativa: var(--cor-edicao);
      --cor-hover-ativa: var(--cor-edicao-hover);
    }

    /* ==========================================================================
     2. ESTILOS DE FORMULÁRIO (Automáticos)
     ========================================================================== */
    .card-header.form-header {
      background-color: var(--cor-fundo-claro);
      border-bottom: 2px solid var(--cor-primaria-ativa);
    }

    .form-header .font-weight-bold {
      color: var(--cor-primaria-ativa) !important;
      font-size: 1.1rem;
    }

    form label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--cor-texto-escuro);
    }

    .form-control:focus {
      border-color: var(--cor-primaria-ativa);
      box-shadow: 0 0 0 0.2rem color-mix(in srgb, var(--cor-primaria-ativa) 25%, transparent);
    }

    form fieldset {
      border-color: var(--cor-borda-suave) !important;
    }

    form legend {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--cor-secundaria);
    }

    form hr {
      margin-top: 1.5rem !important;
      margin-bottom: 1.5rem !important;
    }

    /* ==========================================================================
     3. BOTÕES (Automático e Refinado)
     ========================================================================== */
    .btn-principal-custom {
      background-color: var(--cor-primaria-ativa);
      border-color: var(--cor-primaria-ativa);
      color: white;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-principal-custom:hover {
      background-color: var(--cor-hover-ativa);
      border-color: var(--cor-hover-ativa);
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary {
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
  </style>

</head>

<body>
  <div class="pagina-edicao">
    <div class="text-right mb-3">
      <p class="text-muted small">Os campos marcados com <span class="text-danger">*</span> são obrigatórios.</p>
    </div>

    <div class="card shadow mb-4 rounded">
      <div class="card-header py-3 form-header">
        <h6 class="m-0 font-weight-bold text-primary">
          <i class="fas fa-map-pin mr-2"></i> Editar Local
        </h6>
      </div>

      <div class="card-body">
        <form th:action="@{|/locais/editar/${local.id}|}" th:object="${local}" method="post" class="needs-validation"
          novalidate onsubmit="return validateLocalEditForm()">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <input type="hidden" th:field="*{id}" />

          <fieldset class="form-group border p-3 rounded">
            <legend class="w-auto px-2">Dados do Local</legend>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="comarca">Comarca<span class="text-danger">*</span>:</label>
                <input type="text" class="form-control" id="comarca" th:field="*{comarca}" required />
                <div class="invalid-feedback">
                  Por favor, insira a comarca.
                </div>
              </div>
              <div class="form-group col-md-6">
                <label for="localizacao">Localização<span class="text-danger">*</span>:</label>
                <input type="text" class="form-control" id="localizacao" th:field="*{localizacao}" required />
                <div class="invalid-feedback">
                  Por favor, insira a localização.
                </div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="especialidade">Especialidade<span class="text-danger">*</span>:</label>
                <input type="text" class="form-control" id="especialidade" th:field="*{especialidade}" required />
                <div class="invalid-feedback">
                  Por favor, insira a especialidade.
                </div>
              </div>
              <div class="form-group col-md-6">
                <label for="numeroVara">Número da Vara<span class="text-danger">*</span>:</label>
                <input type="text" class="form-control" id="numeroVara" th:field="*{numeroVara}" required />
                <div class="invalid-feedback">
                  Por favor, insira o número da vara.
                </div>
              </div>
            </div>

            <div class="form-group d-none">
              <label for="codigo">Código:</label>
              <input type="number" class="form-control" id="codigo" th:field="*{codigo}" required />
              <div class="invalid-feedback">
                Por favor, insira o código.
              </div>
            </div>

            <div class="form-group">
              <label for="obs">Observações:</label>
              <textarea class="form-control" id="obs" th:field="*{obs}" rows="3"></textarea>
            </div>
          </fieldset>

          <hr class="mt-4 mb-4">

          <button type="submit" class="btn btn-success btn-principal-custom shadow-sm">
            <i class="fas fa-sync-alt mr-1"></i> Atualizar
          </button>
          <a th:href="@{/locais/listar}" class="btn btn-secondary ml-2 shadow-sm">
            <i class="fas fa-times-circle mr-1"></i> Cancelar
          </a>
        </form>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/foot :: bot}"></th:block>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

  <script th:inline="javascript">
    // Validação do Bootstrap para exibir mensagens de erro
    (function () {
      'use strict';
      window.addEventListener('load', function () {
        var forms = document.getElementsByClassName('needs-validation');
        Array.prototype.filter.call(forms, function (form) {
          form.addEventListener('submit', function (event) {
            if (form.checkValidity() === false) {
              event.preventDefault();
              event.stopPropagation();
            }
            form.classList.add('was-validated');
          }, false);
        });
      }, false);
    })();

    // Função de validação personalizada para o formulário de edição de local
    function validateLocalEditForm() {
      const form = document.querySelector('.needs-validation');
      const comarcaInput = document.getElementById('comarca');
      const localizacaoInput = document.getElementById('localizacao');
      const especialidadeInput = document.getElementById('especialidade');
      const numeroVaraInput = document.getElementById('numeroVara');
      const codigoInput = document.getElementById('codigo');

      // Limpa validações anteriores
      comarcaInput.classList.remove('is-invalid');
      localizacaoInput.classList.remove('is-invalid');
      especialidadeInput.classList.remove('is-invalid');
      numeroVaraInput.classList.remove('is-invalid');
      codigoInput.classList.remove('is-invalid');

      // 1. Validação básica do Bootstrap (required, etc.)
      if (form.checkValidity() === false) {
        form.classList.add('was-validated');
        // Adiciona um pequeno atraso para que o navegador exiba o feedback padrão
        setTimeout(() => {
          const firstInvalid = form.querySelector('.is-invalid');
          if (firstInvalid) {
            firstInvalid.focus();
          }
        }, 100);
        return false;
      }

      // Função auxiliar para verificar se o campo está vazio ou só com espaços
      const isEmptyOrSpaces = (str) => !str || String(str).trim() === ''; // Converte para String

      let isValid = true;
      let errorMessage = '';

      // 2. Validações personalizadas (apenas para campos obrigatórios)
      if (isEmptyOrSpaces(comarcaInput.value)) {
        comarcaInput.classList.add('is-invalid');
        isValid = false;
        errorMessage = 'Por favor, insira a comarca.';
      } else if (isEmptyOrSpaces(localizacaoInput.value)) {
        localizacaoInput.classList.add('is-invalid');
        isValid = false;
        errorMessage = 'Por favor, insira a localização.';
      } else if (isEmptyOrSpaces(especialidadeInput.value)) {
        especialidadeInput.classList.add('is-invalid');
        isValid = false;
        errorMessage = 'Por favor, insira a especialidade.';
      } else if (isEmptyOrSpaces(numeroVaraInput.value)) {
        numeroVaraInput.classList.add('is-invalid');
        isValid = false;
        errorMessage = 'Por favor, insira o número da vara.';
      } else if (isNaN(codigoInput.value) || parseInt(codigoInput.value) <= 0) {
        codigoInput.classList.add('is-invalid');
        isValid = false;
        errorMessage = 'O código deve ser um número válido maior que zero.';
      }


      if (!isValid) {
        Swal.fire({
          icon: 'error',
          title: 'Erro de Validação!',
          text: errorMessage || 'Por favor, preencha todos os campos obrigatórios e válidos.',
          confirmButtonText: 'Ok'
        });
        return false; // Impede o envio do formulário se houver erros
      }

      // Se todas as validações passarem
      Swal.fire({
        icon: 'success',
        title: 'Local Atualizado!',
        text: 'Os dados do local foram salvos com sucesso.',
        showConfirmButton: false,
        timer: 2000 // Fecha automaticamente após 2 segundos
      });

      return true; // Permite o envio do formulário
    }

    // --- Aplicação de Máscaras e Event Listeners ---
    $(document).ready(function () {
      // Se houver necessidade de máscaras futuras, elas iriam aqui.
      // Exemplo (se numeroVara ou codigo tivessem um formato específico):
      // $('#numeroVara').mask('000');
      // $('#codigo').mask('AAAA-0000', { translation: { 'A': { pattern: /[A-Z]/ } } });
    });
  </script>
</body>

</html>
