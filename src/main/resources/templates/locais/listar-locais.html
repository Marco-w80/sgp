<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Lista de Locais</title>
  <th:block th:replace="~{fragments/head :: top}"></th:block>

  <style>
    /* Estilo para arredondar as bordas da tabela */
    .table-rounded-corners {
      border-collapse: separate;
      border-spacing: 0;
      border-radius: .5rem;
      overflow: hidden;
    }

    /* Estilo para o cabeçalho da tabela */
    .table-rounded-corners thead {
      background-color: #e2e6ea;
      color: #343a40;
    }

    /* Alinhamento vertical no meio para cabeçalhos */
    .table-rounded-corners th {
      vertical-align: middle;
      text-align: center;
    }

    /* Centralizar o conteúdo das células do corpo (geral para texto) */
    .table-rounded-corners td {
      text-align: center;
      vertical-align: middle;
    }

    /* Estilo para botões circulares */
    .btn-circle {
      width: 35px;
      height: 35px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Ajuste para botões pequenos circulares */
    .btn-circle.btn-sm {
      width: 30px;
      height: 30px;
      font-size: 0.8rem;
    }

    /* Garante que o TD da coluna de ações tenha altura suficiente para o flexbox e centralize seu conteúdo */
    .table-rounded-corners td.actions-column {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      box-sizing: border-box;
    }

    /* Garante que os ícones dentro dos botões sejam centralizados */
    .btn-circle i {
      display: block;
    }
  </style>
</head>

<body>
  <div class="card shadow mb-4 rounded">
    <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-map-marked-alt mr-2"></i> Locais Cadastrados
      </h6>
      <a th:href="@{/locais/cadastrar}" class="btn btn-primary shadow-sm">
        <i class="fas fa-map-marker-alt mr-1"></i> Cadastrar Novo Local
      </a>
    </div>

    <div class="card-body">
      <div class="table-responsive">
        <table id="tabelaLocais" class="table table-bordered table-hover w-100 table-rounded-corners" cellspacing="0">
          <thead class="thead-light">
            <tr>
              <th class="text-center">ID</th>
              <th class="text-center">Comarca</th>
              <th class="text-center">Especialidade</th>
              <th class="text-center">Nº Vara</th>
              <th class="text-center">Código</th>
              <th class="text-center">Localização</th>
              <th class="text-center">Observações</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="loc : ${locais}">
              <td th:text="${loc.id}"></td>
              <td th:text="${loc.comarca}"></td>
              <td th:text="${loc.especialidade}"></td>
              <td th:text="${loc.numeroVara}"></td>
              <td th:text="${loc.codigo}"></td>
              <td th:text="${loc.localizacao}"></td>
              <td th:text="${loc.obs}"></td>
              <td class="actions-column"> <a th:href="@{|/locais/editar/${loc.id}|}"
                  class="btn btn-circle btn-sm btn-secondary shadow-sm" title="Editar">
                  <i class="fas fa-edit"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/foot :: bot}"></th:block>

  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        columnDefs: [
          // Desabilita ordenação na última coluna (Ações)
          { orderable: false, targets: -1 }
        ],
        scrollX: true // Adiciona rolagem horizontal se a tabela for muito larga
      });

</body>
