<head>
  <title>Lista de Locais</title>
  <div th:replace="~{fragments/head :: top}"></div>
</head>

<div class="card shadow mb-4">

  <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-map-marked-alt mr-2"></i> Locais Cadastrados
    </h6>
    <a th:href="@{/locais/cadastrar}" class="btn btn-primary">
      <i class="fas fa-map-marker-alt mr-1"></i> Cadastrar Novo Local
    </a>
  </div>

  <div class="card-body">
    <div class="table-responsive">
      <table id="tabelaLocais" class="table table-bordered table-hover" width="100%" cellspacing="0">
        <thead class="thead-light">
          <tr>
            <th>ID</th>
            <th>Comarca</th>
            <th>Especialidade</th>
            <th>Nº Vara</th>
            <th>Código</th>
            <th>Localização</th>
            <th>Observações</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="loc : ${locais}">
            <td th:text="${loc.id}"></td>
            <td th:text="${loc.comarca}"></td>
            <td th:text="${loc.especialidade}"></td>
            <td th:text="${loc.numeroVara}"></td>
            <td th:text="${loc.codigo}"></td>
            <td th:text="${loc.localizacao}"></td>
            <td th:text="${loc.obs}"></td>
            <td>
              <a th:href="@{|/locais/editar/${loc.id}|}" class="btn btn-sm btn-secondary">
                <i class="fas fa-edit"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div th:replace="~{fragments/foot :: bot}"></div>
</div>



<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>

<script>
  $(document).ready(function () {
    $('#tabelaLocais').DataTable({
      language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
      pageLength: 10,
      lengthMenu: [5, 10, 25, 50]
    });
  });
</script>

</html>
