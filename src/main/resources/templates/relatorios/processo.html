<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Relatório de Processos</title>
  <th:block th:replace="~{fragments/head :: top}"></th:block>

  <link href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.bootstrap4.min.css" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. PALETA DE CORES E TEMA GLOBAL (PADRÃO DO SISTEMA)
       ========================================================================== */
    :root {
      --cor-primaria: #166298;
      --cor-secundaria: #192f51;
      --cor-fundo-claro: #f8f9fc;
      --cor-texto-escuro: #5a5c69;
      --cor-borda-suave: #e3e6f0;
      --cor-fundo-hover: #f1f3f8;
      --cor-sucesso: #1cc88a;
      --cor-perigo: #e74a3b;
    }

    body {
      background-color: #f1f5f9;
      color: var(--cor-texto-escuro);
    }

    /* ==========================================================================
       2. CRITÉRIOS DE FILTRO (FIELDSET ESTILIZADO)
       ========================================================================== */
    fieldset.filter-fieldset {
      border: none;
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      background-color: #fff;
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.05) !important;
    }

    legend.filter-legend {
      width: auto;
      padding: 0.2rem 1rem;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--cor-primaria);
      letter-spacing: 0.05em;
      background-color: var(--cor-fundo-claro);
      border-radius: 0.375rem;
      border: 1px solid var(--cor-borda-suave);
    }

    .form-label {
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--cor-secundaria);
      margin-bottom: 0.4rem;
    }

    /* ==========================================================================
       3. CARD PRINCIPAL E CABEÇALHO (PADRÃO)
       ========================================================================== */
    .card.shadow {
      border: none;
      border-radius: 0.75rem;
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.07) !important;
    }

    .card-header {
      background-color: var(--cor-fundo-claro);
      border-bottom: 2px solid var(--cor-primaria);
      padding: 1rem 1.5rem;
      border-top-left-radius: 0.75rem;
      border-top-right-radius: 0.75rem;
    }

    .card-header h6 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--cor-primaria) !important;
    }

    .card-body-table {
      padding: 0 !important;
    }

    /* ==========================================================================
       4. BOTÕES PADRONIZADOS
       ========================================================================== */
    .btn {
      font-weight: 600 !important;
      transition: all 0.2s ease-in-out !important;
      border-radius: 0.375rem;
    }

    .btn:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12) !important;
    }

    .btn-primary { background-color: var(--cor-primaria) !important; border-color: var(--cor-primaria) !important; color: white !important; }
    .btn-primary:hover { background-color: var(--cor-secundaria) !important; border-color: var(--cor-secundaria) !important; }
    
    .btn-success { background-color: var(--cor-sucesso) !important; border: none !important; color: white !important; }

    /* ==========================================================================
       5. TABELA ELEGANTE E REFINADA
       ========================================================================== */
    .table-container {
      border-radius: 0 0 0.75rem 0.75rem !important;
      background-color: #fff !important;
      overflow: hidden !important;
    }

    .table {
      border: 1px solid var(--cor-borda-suave) !important;
      width: 100% !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      background-color: #fff !important;
      margin-bottom: 0 !important;
    }

    /* Cantos arredondados das células */
    .table thead:first-child tr:first-child th:first-child { border-top-left-radius: 0.75rem !important; }
    .table thead:first-child tr:first-child th:last-child { border-top-right-radius: 0.75rem !important; }
    .table tbody:last-of-type tr:last-child td:first-child { border-bottom-left-radius: 0.75rem !important; }
    .table tbody:last-of-type tr:last-child td:last-child { border-bottom-right-radius: 0.75rem !important; }

    .table th {
      color: var(--cor-secundaria) !important;
      font-weight: 700 !important;
      text-align: center !important;
      vertical-align: middle !important;
      padding: 1rem 0.75rem !important;
      text-transform: uppercase !important;
      font-size: 0.70rem !important;
      letter-spacing: 0.04em !important;
      border-bottom: 2px solid var(--cor-borda-suave) !important;
      border-top: none !important;
      background-color: var(--cor-fundo-claro) !important;
      white-space: nowrap;
    }

    .table td {
      text-align: center;
      vertical-align: middle !important;
      padding: 0.75rem !important;
      border-top: 1px solid var(--cor-borda-suave) !important;
      color: var(--cor-texto-escuro) !important;
      background-color: #fff !important;
      font-size: 0.8rem;
    }

    .table tbody tr:hover td {
      background-color: var(--cor-fundo-hover) !important;
      transition: background-color 0.2s ease-in-out !important;
    }

    /* Ajustes visuais para as colunas fixadas pelo plugin */
    .dtfc-fixed-right {
      background-color: #fff !important;
      border-left: 1px solid var(--cor-borda-suave) !important; /* Divisória visual suave */
    }
    
    .table thead .dtfc-fixed-right {
      background-color: var(--cor-fundo-claro) !important;
    }

    .table tbody tr:hover .dtfc-fixed-right {
      background-color: var(--cor-fundo-hover) !important;
    }

    /* ==========================================================================
       6. ESTILOS ESPECÍFICOS DO RELATÓRIO (COLUNAS E TRUNCAMENTO)
       ========================================================================== */
    .col-narrow { width: 1%; min-width: 45px; text-align: center !important; }

    .col-deferimentos {
      min-width: 320px;
      white-space: normal !important;
      text-align: left !important;
      font-size: 0.75rem !important;
    }

    .deferimento-list { margin: 0; padding-left: 1rem; }
    
    .truncate-rel {
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-success { color: var(--cor-sucesso) !important; }
    .text-danger { color: var(--cor-perigo) !important; }

    /* ==========================================================================
       7. DATATABLES ESTILIZADO
       ========================================================================== */
    div.dataTables_wrapper { padding: 1.5rem !important; }
    
    div.dataTables_wrapper .dataTables_paginate .pagination .page-link {
      color: var(--cor-primaria) !important;
      background-color: #f1f5f9 !important;
      border: 1px solid var(--cor-borda-suave) !important;
      margin: 0 0.15rem !important;
      border-radius: 0.375rem !important;
    }

    div.dataTables_wrapper .dataTables_paginate .pagination .page-item.active .page-link {
      background-color: var(--cor-primaria) !important;
      border-color: var(--cor-primaria) !important;
      color: #fff !important;
    }

    /* ==========================================================================
       CORREÇÃO DO CABEÇALHO FANTASMA E ALINHAMENTO (DATATABLES)
       ========================================================================== */
    .dataTables_scrollBody thead th,
    .dataTables_scrollBody thead td {
      padding-top: 0 !important;
      padding-bottom: 0 !important;
      border-top: none !important;
      border-bottom: none !important;
      height: 0 !important;
      /* Mantemos o padding e borders laterais intocados para o DataTables 
         conseguir calcular o alinhamento das colunas corretamente! */
    }
    
    .dataTables_scrollBody thead tr {
      height: 0 !important;
    }
  </style>
</head>

<body>

  <div class="container-fluid py-4">
    
    <fieldset class="filter-fieldset">
      <legend class="filter-legend shadow-sm">
        <i class="fas fa-filter mr-2"></i> Critérios de Filtro
      </legend>
      <form th:action="@{/relatorios/processos}" method="get">
        <div class="form-row">
          <div class="form-group col-md-2">
            <label for="de" class="form-label">Início De:</label>
            <input type="date" id="de" name="de" class="form-control form-control-sm" th:value="${param.de}">
          </div>
          <div class="form-group col-md-2">
            <label for="ate" class="form-label">Até:</label>
            <input type="date" id="ate" name="ate" class="form-control form-control-sm" th:value="${param.ate}">
          </div>
          <div class="form-group col-md-2">
            <label for="status" class="form-label">Status:</label>
            <select id="status" name="status" class="form-control form-control-sm">
              <option value="">Todos</option>
              <option th:each="s : ${statusValues}" th:value="${s}"
                th:text="${s.name() == 'OBITO' ? 'ÓBITO' : #strings.replace(s.name(), '_', ' ')}"
                th:selected="${param.status} == ${s}"></option>
            </select>
          </div>
          <div class="form-group col-md-3">
            <label for="paciente" class="form-label">Paciente:</label>
            <input type="text" id="paciente" name="paciente" class="form-control form-control-sm" th:value="${param.paciente}" placeholder="Nome ou CPF">
          </div>
          <div class="form-group col-md-3">
            <label for="localId" class="form-label">Local:</label>
            <select id="localId" name="localId" class="form-control form-control-sm">
              <option value="">Todos</option>
              <option th:each="l : ${locais}" th:value="${l.id}" th:text="${l.comarca}" th:selected="${param.localId} == ${l.id}"></option>
            </select>
          </div>
        </div>

        <div class="form-row align-items-center mt-2">
          <div class="col-auto">
            <div class="custom-control custom-checkbox custom-control-inline">
              <input class="custom-control-input" type="checkbox" id="cpfAnexado" name="cpfAnexado" th:checked="${param.cpfAnexado}">
              <label class="custom-control-label small font-weight-bold text-secondary" for="cpfAnexado">CPF</label>
            </div>
            <div class="custom-control custom-checkbox custom-control-inline">
              <input class="custom-control-input" type="checkbox" id="compResidenciaAnexado" name="compResidenciaAnexado" th:checked="${param.compResidenciaAnexado}">
              <label class="custom-control-label small font-weight-bold text-secondary" for="compResidenciaAnexado">Resid.</label>
            </div>
            <div class="custom-control custom-checkbox custom-control-inline">
              <input class="custom-control-input" type="checkbox" id="compRendaAnexado" name="compRendaAnexado" th:checked="${param.compRendaAnexado}">
              <label class="custom-control-label small font-weight-bold text-secondary" for="compRendaAnexado">Renda</label>
            </div>
            <div class="custom-control custom-checkbox custom-control-inline">
              <input class="custom-control-input" type="checkbox" id="procuracaoAnexado" name="procuracaoAnexado" th:checked="${param.procuracaoAnexado}">
              <label class="custom-control-label small font-weight-bold text-secondary" for="procuracaoAnexado">Proc.</label>
            </div>
            <div class="custom-control custom-checkbox custom-control-inline">
              <input class="custom-control-input" type="checkbox" id="declaracaoInsuficienciaAnexado" name="declaracaoInsuficienciaAnexado" th:checked="${param.declaracaoInsuficienciaAnexado}">
              <label class="custom-control-label small font-weight-bold text-secondary" for="declaracaoInsuficienciaAnexado">Insufic.</label>
            </div>
          </div>
          
          <div class="col text-right">
            <a th:href="@{/relatorios/processos/exportar-excel(de=${param.de}, ate=${param.ate}, status=${param.status}, paciente=${param.paciente}, localId=${param.localId}, cpfAnexado=${param.cpfAnexado}, compResidenciaAnexado=${param.compResidenciaAnexado}, compRendaAnexado=${param.compRendaAnexado}, procuracaoAnexado=${param.procuracaoAnexado}, declaracaoInsuficienciaAnexado=${param.declaracaoInsuficienciaAnexado})}"
               class="btn btn-sm btn-success shadow-sm mr-2">
              <i class="fas fa-file-excel mr-1"></i> Excel
            </a>
            <button type="submit" class="btn btn-sm btn-primary shadow-sm px-4">
              <i class="fas fa-search mr-1"></i> Filtrar
            </button>
          </div>
        </div>
      </form>
    </fieldset>

    <div class="card shadow mb-5">
      <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary">
          <i class="fas fa-table mr-2"></i> Resultados do Relatório
        </h6>
      </div>
      
      <div class="card-body card-body-table">
        <div class="table-container">
          <table id="tabelaRelatorio" class="table table-hover w-100" cellspacing="0" style="width:100%">
            <thead>
              <tr>
                <th class="d-none">ID</th>
                <th>Nº Interno</th>
                <th>Nº Processo</th>
                <th>Início</th>
                <th>Status</th>
                <th>Paciente</th>
                <th>Advogado</th>
                <th>Médico</th>
                <th>Local</th>
                <th class="no-sort col-deferimentos">Deferimentos</th>
                <th class="no-sort col-narrow">CPF</th>
                <th class="no-sort col-narrow">Res.</th>
                <th class="no-sort col-narrow">Ren.</th>
                <th class="no-sort col-narrow">Pro.</th>
                <th class="no-sort col-narrow">Ins.</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="proc : ${processos}">
                <td class="d-none" th:text="${proc.id}"></td>
                <td class="font-weight-bold" style="color: var(--cor-secundaria);" th:text="${proc.numeroInterno}"></td>
                <td th:text="${#strings.isEmpty(proc.numeroProcesso) ? '-' : proc.numeroProcesso}"></td>
                <td th:text="${#temporals.format(proc.dataInicio,'dd/MM/yyyy')}"></td>
                <td>
                  <span class="badge badge-light border" th:text="${proc.status != null and (proc.status.name() == 'CONCLUIDO' or proc.status.name() == 'OBITO') ? 'ÓBITO' : (proc.status != null ? #strings.replace(proc.status.name(), '_', ' ') : '-')}"></span>
                </td>
                <td class="truncate-rel" th:text="${proc.paciente != null ? proc.paciente.nome : ''}"></td>
                <td class="truncate-rel" th:text="${proc.advogado != null ? proc.advogado.nome : ''}"></td>
                <td class="truncate-rel" th:text="${proc.medico != null ? proc.medico.nome : ''}"></td>
                <td th:text="${proc.local != null ? proc.local.comarca : ''}"></td>
                
                <td class="col-deferimentos">
                  <ul class="deferimento-list" th:if="${not #lists.isEmpty(proc.deferimentos)}">
                    <li th:each="def : ${proc.deferimentos}">
                      <strong th:text="${'#' + def.numeroDeferimento}"></strong> 
                      <span class="small text-muted" th:text="${'(' + (def.dataDeferimento != null ? #temporals.format(def.dataDeferimento, 'dd/MM/yyyy') : '-') + ')'}"></span>: 
                      <span th:text="${def.mensagem}"></span>
                    </li>
                  </ul>
                  <span th:if="${#lists.isEmpty(proc.deferimentos)}" class="text-muted">-</span>
                </td>

                <td class="col-narrow">
                  <i th:class="${proc.cpfAnexado ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger'}"></i>
                </td>
                <td class="col-narrow">
                  <i th:class="${proc.compResidenciaAnexado ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger'}"></i>
                </td>
                <td class="col-narrow">
                  <i th:class="${proc.compRendaAnexado ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger'}"></i>
                </td>
                <td class="col-narrow">
                  <i th:class="${proc.procuracaoAnexado ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger'}"></i>
                </td>
                <td class="col-narrow">
                  <i th:class="${proc.declaracaoInsuficienciaAnexado ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger'}"></i>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/foot :: bot}"></th:block>

  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>
  <script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>
  
  <script>
    $(document).ready(function () {
      $('#tabelaRelatorio').DataTable({
        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
        pageLength: 10,
        lengthMenu: [10, 25, 50, 100],
        ordering: true,
        searching: true,
        scrollX: true,         /* ATIVANDO SCROLL HORIZONTAL */
        fixedColumns: {
          left: 0,
          right: 5             /* FIXANDO AS 5 ÚLTIMAS COLUNAS */
        },
        columnDefs: [
          { orderable: false, targets: 'no-sort' }
        ],
        autoWidth: false
      });
    });
  </script>

</body>

</html>
