<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Relatório de Processos</title>
  <th:block th:replace="~{fragments/head :: top}"></th:block>
  <style>
    :root {
      --primary-dark-blue: #2c3e50;
      --primary-blue-hover: #1a252f;
      --secondary-gray: #6c757d;
      --light-gray-bg: #f4f6f9;
      --card-border: #dee2e6;
      --text-dark: #2d2f33;
      --text-light: #ffffff;
      --line-separator: #e0e0e0;
      --success-color: #198754;
      --warning-color: #ffc107;
      --danger-color: #dc3545;

      --table-header-bg-default: var(--primary-dark-blue);
      --table-header-color-default: var(--text-light);
      --table-row-hover-bg: #f1f5f9;
    }


    /* --- Estilo para o FIELDSET (Critérios de Filtro) --- */
    fieldset.filter-fieldset {
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 1.5rem 2rem;
      /* Padding interno do fieldset */
      margin-bottom: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    legend.filter-legend {
      /* Estilos para o título do fieldset */
      padding: 0 0.5rem;
      /* Padding horizontal para o legend */
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-dark);
      width: auto;
      /* Para o legend não ocupar a largura total */
      margin-left: -0.5rem;
      /* Ajuste para o legend se alinhar com a borda */
      margin-bottom: 1rem;
      /* Espaçamento abaixo do legend */
    }

    legend.filter-legend .fas {
      margin-right: 8px;
      color: var(--secondary-gray);
      font-size: 0.95rem;
    }


    /* --- Estilo para o SUB-CARD (Resultados do Relatório) --- */
    /* Mantemos o sub-card-container para a tabela de resultados */
    .sub-card-container {
      background-color: #fff;
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      margin-bottom: 0;
      /* Último elemento, não precisa de margin-bottom extra */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    /* Estilo para arredondar as bordas da tabela */
    .table-rounded-corners {
      border-collapse: separate;
      border-spacing: 0;
      border-radius: .5rem;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      width: 100%;
    }

    /* Removendo ícones dos cabeçalhos da tabela */
    .table-rounded-corners th .fas {
      display: none;
    }

    /* Ajustes de padding e fonte para células da tabela */
    .table-rounded-corners th,
    .table-rounded-corners td {
      text-align: center;
      vertical-align: middle;
      padding: 0.6rem 0.4rem;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .table-rounded-corners th {
      font-weight: 600;
    }

    /* Largura mínima para colunas de ID e anexos */
    .table-rounded-corners td:nth-child(1),
    .table-rounded-corners th:nth-child(1),
    .table-rounded-corners td:nth-child(10),
    .table-rounded-corners th:nth-child(10),
    .table-rounded-corners td:nth-child(11),
    .table-rounded-corners th:nth-child(11),
    .table-rounded-corners td:nth-child(12),
    .table-rounded-corners th:nth-child(12),
    .table-rounded-corners td:nth-child(13),
    .table-rounded-corners th:nth-child(13),
    .table-rounded-corners td:nth-child(14),
    .table-rounded-corners th:nth-child(14) {
      width: 1%;
      max-width: 50px;
      min-width: 30px;
    }

    /* Ajuste para colunas de texto com conteúdo variável */
    .table-rounded-corners td:nth-child(2),
    .table-rounded-corners td:nth-child(3),
    .table-rounded-corners td:nth-child(4),
    .table-rounded-corners td:nth-child(5),
    .table-rounded-corners td:nth-child(6),
    .table-rounded-corners td:nth-child(7),
    .table-rounded-corners td:nth-child(8),
    .table-rounded-corners td:nth-child(9) {
      max-width: 120px;
      width: auto;
    }

    .table-rounded-corners tbody tr:first-child td {
      border-top: none;
    }

    .table-rounded-corners tbody tr:hover {
      background-color: var(--table-row-hover-bg);
    }

    /* Estilos para ícones de check/times nas colunas booleanas */
    .text-success {
      color: var(--success-color) !important;
    }

    .text-danger {
      color: var(--danger-color) !important;
    }

    /* Alinhamento do botão filtrar */
    .form-row.align-items-end {
      align-items: flex-end;
    }

    .form-group.col-md-auto {
      margin-right: 1.5rem;
    }

    .form-group.col-md.text-right {
      flex-grow: 1;
      text-align: right;
    }
  </style>
</head>

<body>

  <div class="card shadow mb-4">
    <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-file-alt mr-2"></i> Relatório de Processos
      </h6>
    </div>

    <div class="card-body">
      <fieldset class="filter-fieldset">
        <legend class="filter-legend">
          <i class="fas fa-filter mr-2"></i> Critérios de Filtro
        </legend>
        <form th:action="@{/relatorios/processos}" method="get">
          <div class="form-row">
            <div class="form-group col-md-3 col-lg-2">
              <label for="de" class="form-label">Data Início De:</label>
              <input type="date" id="de" name="de" class="form-control" th:value="${param.de}">
            </div>
            <div class="form-group col-md-3 col-lg-2">
              <label for="ate" class="form-label">Até:</label>
              <input type="date" id="ate" name="ate" class="form-control" th:value="${param.ate}">
            </div>
            <div class="form-group col-md-3 col-lg-2">
              <label for="status" class="form-label">Status:</label>
              <select id="status" name="status" class="form-control">
                <option value="">Todos</option>
                <option th:each="s : ${statusValues}" th:value="${s}"
                  th:text="${s.name() == 'OBITO' ? 'ÓBITO' : #strings.replace(s.name(), '_', ' ')}"
                  th:selected="${param.status} == ${s}"></option>
              </select>
            </div>
            <div class="form-group col-md-3 col-lg-3">
              <label for="paciente" class="form-label">Paciente:</label>
              <input type="text" id="paciente" name="paciente" class="form-control" th:value="${param.paciente}"
                placeholder="Nome ou CPF">
            </div>
            <div class="form-group col-md-3 col-lg-3">
              <label for="localId" class="form-label">Local:</label>
              <select id="localId" name="localId" class="form-control">
                <option value="">Todos</option>
                <option th:each="l : ${locais}" th:value="${l.id}" th:text="${l.comarca}"
                  th:selected="${param.localId} == ${l.id}"></option>
              </select>
            </div>
          </div>
          <div class="form-row align-items-end mt-3">
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cpfAnexado" name="cpfAnexado"
                  th:checked="${param.cpfAnexado}">
                <label class="form-check-label" for="cpfAnexado">CPF Anexado</label>
              </div>
            </div>
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="compResidenciaAnexado" name="compResidenciaAnexado"
                  th:checked="${param.compResidenciaAnexado}">
                <label class="form-check-label" for="compResidenciaAnexado">Comprovante Residência</label>
              </div>
            </div>
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="compRendaAnexado" name="compRendaAnexado"
                  th:checked="${param.compRendaAnexado}">
                <label class="form-check-label" for="compRendaAnexado">Comprovante Renda</label>
              </div>
            </div>
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="procuracaoAnexado" name="procuracaoAnexado"
                  th:checked="${param.procuracaoAnexado}">
                <label class="form-check-label" for="procuracaoAnexado">Procuração Anexada</label>
              </div>
            </div>
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="declaracaoInsuficienciaAnexado"
                  name="declaracaoInsuficienciaAnexado" th:checked="${param.declaracaoInsuficienciaAnexado}">
                <label class="form-check-label" for="declaracaoInsuficienciaAnexado">Declaração Insuficiência</label>
              </div>
            </div>
            <div class="form-group col-md text-right">
              <a th:href="@{/relatorios/processos/exportar-excel(
                  de=${param.de},
                  ate=${param.ate},
                  status=${param.status},
                  paciente=${param.paciente},
                  localId=${param.localId},
                  cpfAnexado=${param.cpfAnexado},
                  compResidenciaAnexado=${param.compResidenciaAnexado},
                  compRendaAnexado=${param.compRendaAnexado},
                  procuracaoAnexado=${param.procuracaoAnexado},
                  declaracaoInsuficienciaAnexado=${param.declaracaoInsuficienciaAnexado})}"
                 class="btn btn-success mr-2">
                <i class="fas fa-file-excel mr-1"></i> Exportar Excel
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-search mr-1"></i> Filtrar
              </button>
            </div>
          </div>
        </form>
      </fieldset>
    </div>
  </div>
  <div class="sub-card-container">
    <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-table mr-2"></i> Resultados do Relatório
      </h6>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table id="tabelaProcessos" class="table w-100 table-rounded-corners" cellspacing="0">
          <thead>
            <tr>
              <th class="text-center d-none">ID</th>
              <th class="text-center">Nº Interno</th>
              <th class="text-center">Nº Processo</th>
              <th class="text-center">Data Início</th>
              <th class="text-center">Status</th>
              <th class="text-center">Paciente</th>
              <th class="text-center">Advogado</th>
              <th class="text-center">Médico</th>
              <th class="text-center">Local</th>
              <th class="text-center">Deferimentos</th>
              <th class="text-center" data-orderable="false">CPF</th>
              <th class="text-center" data-orderable="false">Resid.</th>
              <th class="text-center" data-orderable="false">Renda</th>
              <th class="text-center" data-orderable="false">Proc.</th>
              <th class="text-center" data-orderable="false">Decl. Insuf.</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="proc : ${processos}">
              <td class="d-none" th:text="${proc.id}"></td>
              <td th:text="${proc.numeroInterno}"></td>
              <td th:text="${proc.numeroProcesso}"></td>
              <td th:text="${#temporals.format(proc.dataInicio,'dd/MM/yyyy')}"></td>
              <td th:text="${proc.status != null and (proc.status.name() == 'CONCLUIDO' or proc.status.name() == 'OBITO') ? 'ÓBITO' : (proc.status != null ? #strings.replace(proc.status.name(), '_', ' ') : '-')}"></td>
              <td th:text="${proc.paciente != null ? proc.paciente.nome : ''}"></td>
              <td th:text="${proc.advogado != null ? proc.advogado.nome : ''}"></td>
              <td th:text="${proc.medico != null ? proc.medico.nome : ''}"></td>
              <td th:text="${proc.local != null ? proc.local.comarca : ''}"></td>
              <td class="text-left" style="white-space: normal; min-width: 260px;">
                <ul class="mb-0 pl-3" th:if="${not #lists.isEmpty(proc.deferimentos)}">
                  <li th:each="def : ${proc.deferimentos}">
                    <span th:text="${'#' + def.numeroDeferimento + ' - '}"></span>
                    <span th:if="${def.tipo != null}"
                      th:text="${def.tipo == T(com.sgp.model.TipoDeferimento).GRUPO_PROD ? 'Grupo Prod' : 'Juiz'}"></span>
                    <span th:unless="${def.tipo != null}">-</span>
                    <span th:text="${' (' + (def.dataDeferimento != null ? #temporals.format(def.dataDeferimento, 'dd/MM/yyyy') : '-') + '): '}"></span>
                    <span th:if="${def.mensagem != null and !#strings.isEmpty(#strings.trim(def.mensagem))}" th:text="${def.mensagem}"></span>
                    <span th:unless="${def.mensagem != null and !#strings.isEmpty(#strings.trim(def.mensagem))}">-</span>
                  </li>
                </ul>
                <span th:if="${#lists.isEmpty(proc.deferimentos)}">-</span>
              </td>
              <td>
                <i class="fas fa-check-circle text-success" th:if="${proc.cpfAnexado}"></i>
                <i class="fas fa-times-circle text-danger" th:unless="${proc.cpfAnexado}"></i>
              </td>
              <td>
                <i class="fas fa-check-circle text-success" th:if="${proc.compResidenciaAnexado}"></i>
                <i class="fas fa-times-circle text-danger" th:unless="${proc.compResidenciaAnexado}"></i>
              </td>
              <td>
                <i class="fas fa-check-circle text-success" th:if="${proc.compRendaAnexado}"></i>
                <i class="fas fa-times-circle text-danger" th:unless="${proc.compRendaAnexado}"></i>
              </td>
              <td>
                <i class="fas fa-check-circle text-success" th:if="${proc.procuracaoAnexado}"></i>
                <i class="fas fa-times-circle text-danger" th:unless="${proc.procuracaoAnexado}"></i>
              </td>
              <td>
                <i class="fas fa-check-circle text-success" th:if="${proc.declaracaoInsuficienciaAnexado}"></i>
                <i class="fas fa-times-circle text-danger" th:unless="${proc.declaracaoInsuficienciaAnexado}"></i>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(processos)}">
              <td colspan="15" class="text-center">Nenhum processo encontrado com os filtros aplicados.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/foot :: bot}"></th:block>

  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>
  <script>
    $(document).ready(function () {
      $('#tabelaProcessos').DataTable({
        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
        pageLength: 10,
        lengthMenu: [5, 10, 25, 50],
        ordering: true,
        searching: true,
        columnDefs: [
          { orderable: false, targets: [9, 10, 11, 12, 13, 14] }
        ],
        autoWidth: false,
        scrollX: true
      });
    });
  </script>

</body>

</html>
