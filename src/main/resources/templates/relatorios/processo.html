<head>
  <title>Relatório de Processos</title>
  <div th:replace="~{fragments/head :: top}"></div>
</head>

<div class="card shadow mb-4">
  <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-file-alt mr-2"></i> Relatório de Processos
    </h6>
  </div>

  <div class="card-body">
    <div class="card shadow mb-4">
      <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">
          <i class="fas fa-filter mr-2"></i> Critérios de Filtro
        </h6>
      </div>
      <div class="card-body">
        <form th:action="@{/relatorios/processos}" method="get">
          <div class="form-row">
            <div class="form-group col-md-3 col-lg-2">
              <label for="de">Data Início De:</label>
              <input type="date" id="de" name="de" class="form-control" th:value="${param.de}">
            </div>
            <div class="form-group col-md-3 col-lg-2">
              <label for="ate">Até:</label>
              <input type="date" id="ate" name="ate" class="form-control" th:value="${param.ate}">
            </div>
            <div class="form-group col-md-3 col-lg-2">
              <label for="status">Status:</label>
              <select id="status" name="status" class="form-control">
                <option value="">Todos</option>
                <option th:each="s : ${statusValues}" th:value="${s}" th:text="${s}"
                  th:selected="${param.status} == ${s}"></option>
              </select>
            </div>
            <div class="form-group col-md-3 col-lg-3">
              <label for="paciente">Paciente:</label>
              <input type="text" id="paciente" name="paciente" class="form-control" th:value="${param.paciente}"
                placeholder="Nome ou CPF">
            </div>
            <div class="form-group col-md-3 col-lg-3">
              <label for="localId">Local:</label>
              <select id="localId" name="localId" class="form-control">
                <option value="">Todos</option>
                <option th:each="l : ${locais}" th:value="${l.id}" th:text="${l.comarca}"
                  th:selected="${param.localId} == ${l.id}"></option>
              </select>
            </div>
          </div>
          <div class="form-row align-items-end">
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cpfAnexado" name="cpfAnexado"
                  th:checked="${param.cpfAnexado}">
                <label class="form-check-label" for="cpfAnexado">Com CPF</label>
              </div>
            </div>
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="compResidenciaAnexado" name="compResidenciaAnexado"
                  th:checked="${param.compResidenciaAnexado}">
                <label class="form-check-label" for="compResidenciaAnexado">Comp. Residência</label>
              </div>
            </div>
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="compRendaAnexado" name="compRendaAnexado"
                  th:checked="${param.compRendaAnexado}">
                <label class="form-check-label" for="compRendaAnexado">Comp. Renda</label>
              </div>
            </div>
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="procuracaoAnexado" name="procuracaoAnexado"
                  th:checked="${param.procuracaoAnexado}">
                <label class="form-check-label" for="procuracaoAnexado">Procuração</label>
              </div>
            </div>
            <div class="form-group col-md-auto">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="declaracaoInsuficienciaAnexado"
                  name="declaracaoInsuficienciaAnexado" th:checked="${param.declaracaoInsuficienciaAnexado}">
                <label class="form-check-label" for="declaracaoInsuficienciaAnexado">Decl. Insuficiência</label>
              </div>
            </div>
            <div class="form-group col-md text-right"> <button type="submit" class="btn btn-primary">
                <i class="fas fa-search mr-1"></i> Filtrar
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow mb-4">
      <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">
          <i class="fas fa-table mr-2"></i> Resultados do Relatório
        </h6>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table id="tabelaProcessos" class="table table-bordered table-hover table-sm" width="100%" cellspacing="0">
            <thead class="thead-light">
              <tr>
                <th>ID</th>
                <th>Nº Interno</th>
                <th>Nº Processo</th>
                <th>Data Início</th>
                <th>Status</th>
                <th>Paciente</th>
                <th>Advogado</th>
                <th>Médico</th>
                <th>Local</th>
                <th data-orderable="false" class="text-center">CPF</th>
                <th data-orderable="false" class="text-center">Resid.</th>
                <th data-orderable="false" class="text-center">Renda</th>
                <th data-orderable="false" class="text-center">Proc.</th>
                <th data-orderable="false" class="text-center">Decl. Insuf.</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="proc : ${processos}">
                <td th:text="${proc.id}"></td>
                <td th:text="${proc.numeroInterno}"></td>
                <td th:text="${proc.numeroProcesso}"></td>
                <td th:text="${proc.dataInicio}"></td>
                <td th:text="${proc.status}"></td>
                <td th:text="${proc.paciente != null ? proc.paciente.nome : ''}"></td>
                <td th:text="${proc.advogado != null ? proc.advogado.nome : ''}"></td>
                <td th:text="${proc.medico != null ? proc.medico.nome : ''}"></td>
                <td th:text="${proc.local != null ? proc.local.comarca : ''}"></td>
                <td class="text-center">
                  <i class="fas fa-check text-success" th:if="${proc.cpfAnexado}"></i>
                  <i class="fas fa-times text-danger" th:unless="${proc.cpfAnexado}"></i>
                </td>
                <td class="text-center">
                  <i class="fas fa-check text-success" th:if="${proc.compResidenciaAnexado}"></i>
                  <i class="fas fa-times text-danger" th:unless="${proc.compResidenciaAnexado}"></i>
                </td>
                <td class="text-center">
                  <i class="fas fa-check text-success" th:if="${proc.compRendaAnexado}"></i>
                  <i class="fas fa-times text-danger" th:unless="${proc.compRendaAnexado}"></i>
                </td>
                <td class="text-center">
                  <i class="fas fa-check text-success" th:if="${proc.procuracaoAnexado}"></i>
                  <i class="fas fa-times text-danger" th:unless="${proc.procuracaoAnexado}"></i>
                </td>
                <td class="text-center">
                  <i class="fas fa-check text-success" th:if="${proc.declaracaoInsuficienciaAnexado}"></i>
                  <i class="fas fa-times text-danger" th:unless="${proc.declaracaoInsuficienciaAnexado}"></i>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(processos)}">
                <td colspan="14" class="text-center">Nenhum processo encontrado com os filtros aplicados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/foot :: bot}"></div>

<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>
<script>
  $(document).ready(function () {
    $('#tabelaProcessos').DataTable({
      language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
      pageLength: 10,
      lengthMenu: [5, 10, 25, 50],
      ordering: true, // Habilita ordenação
      searching: true // Desabilita a caixa de busca global do DataTables, já que temos nossos próprios filtros
    });
  });
</script>

</html>
