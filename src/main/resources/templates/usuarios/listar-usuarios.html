<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Lista de Usuários</title>
  <div th:replace="~{fragments/head :: top}"></div>
</head>

<body>

  <div class="card shadow mb-4">

    <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-users mr-2"></i> Usuários Cadastrados
      </h6>
      <a th:href="@{/usuarios/cadastrar}" class="btn btn-primary">
        <i class="fas fa-user-plus mr-1"></i> Novo Usuário
      </a>
    </div>

    <div class="card-body">
      <div class="table-responsive">
        <table id="tabelaUsuarios" class="table table-bordered table-hover" width="100%" cellspacing="0">
          <thead class="thead-light">
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${usuarios}">
              <td th:text="${u.id}"></td>
              <td th:text="${u.nome}"></td>
              <td th:text="${u.email}"></td>
              <td>
                <a th:href="@{|/usuarios/editar/${u.id}|}" class="btn btn-sm btn-secondary">
                  <i class="fas fa-edit"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/foot :: bot}"></div>

  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>

  <script>
    $(document).ready(function () {
      $('#tabelaUsuarios').DataTable({
        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
        pageLength: 10,
        lengthMenu: [5, 10, 25, 50]
      });
    });
  </script>
</body>

</html>
