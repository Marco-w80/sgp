<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Lista de Usuários</title>
  <th:block th:replace="~{fragments/head :: top}"></th:block>

  <style>
    /* Estilo para arredondar as bordas da tabela */
    .table-rounded-corners {
      border-collapse: separate;
      /* Necessário para border-radius em tabelas */
      border-spacing: 0;
      /* Remove espaçamento entre células para bordas contínuas */
      border-radius: .5rem;
      /* Ajuste o valor para o quão arredondado você quer */
      overflow: hidden;
      /* Garante que o conteúdo não vaze das bordas arredondadas */
    }

    /* Estilo para o cabeçalho da tabela */
    .table-rounded-corners thead {
      background-color: #e2e6ea;
      /* Um cinza claro e elegante */
      color: #343a40;
      /* Cor do texto mais escura para contraste */
    }

    /* Centralizar o conteúdo das células do cabeçalho */
    .table-rounded-corners th {
      text-align: center;
      vertical-align: middle;
      /* Alinha verticalmente no meio */
    }

    /* Centralizar o conteúdo das células do corpo (geral para texto) */
    .table-rounded-corners td {
      text-align: center;
      vertical-align: middle;
      /* Alinha verticalmente no meio */
    }

    /* Estilo para botões circulares */
    .btn-circle {
      width: 35px;
      /* Define a largura */
      height: 35px;
      /* Define a altura */
      padding: 0;
      /* Remove o padding padrão */
      border-radius: 50%;
      /* Transforma em círculo */
      display: flex;
      /* Permite centralizar conteúdo com flexbox */
      align-items: center;
      /* Centraliza verticalmente */
      justify-content: center;
      /* Centraliza horizontalmente */
      flex-shrink: 0;
      /* Evita que o botão encolha */
    }

    /* Ajuste para botões pequenos circulares */
    .btn-circle.btn-sm {
      width: 30px;
      /* Tamanho um pouco menor para 'btn-sm' */
      height: 30px;
      font-size: 0.8rem;
      /* Ajusta o tamanho da fonte do ícone, se necessário */
    }

    /* Garante que o TD da coluna de ações tenha altura suficiente para o flexbox e centralize seu conteúdo */
    .table-rounded-corners td.actions-column {
      display: flex;
      /* Transforma a célula em um contêiner flexível */
      align-items: center;
      /* Centraliza verticalmente o item dentro da célula */
      justify-content: center;
      /* Centraliza horizontalmente o item dentro da célula */
      height: 100%;
      /* Permite que a célula se expanda para a altura da linha */
      box-sizing: border-box;
      /* Inclui padding e bordas no cálculo da largura/altura */
    }

    /* Garante que os ícones dentro dos botões sejam centralizados */
    .btn-circle i {
      display: block;
      /* Para que o ícone se comporte como um bloco dentro do flex do botão */
    }
  </style>
</head>

<body>

  <div class="card shadow mb-4 rounded">

    <div class="card-header py-3 d-sm-flex align-items-center justify-content-between">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-users mr-2"></i> Usuários Cadastrados
      </h6>
      <a th:href="@{/usuarios/cadastrar}" class="btn btn-primary shadow-sm">
        <i class="fas fa-user-plus mr-1"></i> Novo Usuário
      </a>
    </div>

    <div class="card-body">
      <div class="table-responsive">
        <table id="tabelaUsuarios" class="table table-bordered table-hover w-100 table-rounded-corners" cellspacing="0">
          <thead class="thead-light">
            <tr>
              <th class="text-center">ID</th>
              <th class="text-center">Nome</th>
              <th class="text-center">Email</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${usuarios}">
              <td th:text="${u.id}"></td>
              <td th:text="${u.nome}"></td>
              <td th:text="${u.email}"></td>
              <td class="actions-column">
                <a th:href="@{|/usuarios/editar/${u.id}|}" class="btn btn-circle btn-sm btn-secondary shadow-sm"
                  title="Editar">
                  <i class="fas fa-edit"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/foot :: bot}"></th:block>

  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    $(document).ready(function () {
      $('#tabelaUsuarios').DataTable({
        language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
        pageLength: 10,
        lengthMenu: [5, 10, 25, 50],
        // Desabilitar ordenação na última coluna (Ações)
        columnDefs: [
          { orderable: false, targets: -1 }
        ]
      });

</body>
