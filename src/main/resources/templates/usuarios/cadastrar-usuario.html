<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Cadastrar Usuário</title>
  <div th:replace="~{fragments/head :: top}"></div>
</head>
<body>
  <div class="container-fluid mt-4">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8"> <div class="card shadow mb-4">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
              <i class="fas fa-user-plus mr-2"></i> Cadastrar Novo Usuário
            </h6>
          </div>

          <div class="card-body">
            <form th:action="@{/usuarios/cadastrar}" th:object="${usuario}" method="post">

              <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}" required/>
              </div>

              <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required/>
              </div>

              <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" class="form-control" id="senha" th:field="*{senha}" required/>
              </div>

              <hr class="mt-4 mb-4"> <button type="submit" class="btn btn-primary">Salvar</button>
              <a th:href="@{/usuarios/listar}" class="btn btn-secondary ml-2">Cancelar</a> </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/foot :: bot}"></div>
</body>
</html>
