<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
  <title>Editar Usuário</title>
  <th:block th:replace="~{fragments/head :: top}"></th:block>
</head>

<body>

  <div class="container-fluid mt-4">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">

        <div class="text-right mb-3">
          <p class="text-muted small">Os campos marcados com <span class="text-danger">*</span> são obrigatórios.
          </p>
        </div>
        <div class="card shadow mb-4 rounded">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
              <i class="fas fa-user-edit mr-2"></i> Editar Usuário
            </h6>
          </div>

          <div class="card-body">

            <form th:action="@{|/usuarios/editar/${usuario.id}|}" th:object="${usuario}" method="post"
              class="needs-validation" novalidate onsubmit="return validateEditUserForm()">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

              <div class="form-group">
                <label for="nome">Nome<span class="text-danger">*</span>:</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}" required minlength="3"
                  placeholder="Digite o nome completo" />
                <div class="invalid-feedback">
                  Por favor, insira um nome com no mínimo 3 caracteres.
                </div>
              </div>

              <div class="form-group">
                <label for="email">Email<span class="text-danger">*</span>:</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required
                  placeholder="exemplo@dominio.com" />
                <div class="invalid-feedback">
                  Por favor, insira um e-mail válido.
                </div>
              </div>

              <div class="form-group">
                <label for="senha">Nova Senha (deixe em branco para manter):</label>
                <input type="password" class="form-control" id="senha" th:field="*{senha}"
                  placeholder="Nova senha (opcional)" minlength="6" />
                <div class="invalid-feedback">
                  A senha deve ter no mínimo 6 caracteres.
                </div>
              </div>

              <div class="form-group">
                <label for="confirmarSenha">Confirmar Nova Senha:</label>
                <input type="password" class="form-control" id="confirmarSenha" placeholder="Confirme a nova senha"
                  minlength="6" />
                <div class="invalid-feedback">
                  As senhas não coincidem ou não possuem no mínimo 6 caracteres.
                </div>
              </div>

              <hr class="mt-4 mb-4">
              <button type="submit" class="btn btn-primary shadow-sm">
                <i class="fas fa-save mr-1"></i> Atualizar
              </button>
              <a th:href="@{/usuarios/listar}" class="btn btn-secondary ml-2 shadow-sm">
                <i class="fas fa-times-circle mr-1"></i> Cancelar
              </a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <th:block th:replace="~{fragments/foot :: bot}"></th:block>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script th:inline="javascript">
    // Validação do Bootstrap para exibir mensagens de erro
    (function () {
      'use strict';
      window.addEventListener('load', function () {
        var forms = document.getElementsByClassName('needs-validation');
        Array.prototype.filter.call(forms, function (form) {
          form.addEventListener('submit', function (event) {
            if (form.checkValidity() === false) {
              event.preventDefault();
              event.stopPropagation();
            }
            form.classList.add('was-validated');
          }, false);
        });
      }, false);
    })();

    // Função de validação personalizada para o formulário de edição de usuário
    function validateEditUserForm() {
      const form = document.querySelector('.needs-validation');
      const senhaInput = document.getElementById('senha');
      const confirmarSenhaInput = document.getElementById('confirmarSenha');
      const emailInput = document.getElementById('email');

      // 1. Validação básica do Bootstrap (required, minlength, type="email")
      // Esta linha garante que os campos "nome" e "email" (que são required) sejam validados primeiro.
      if (form.checkValidity() === false) {
        form.classList.add('was-validated');
        return false;
      }

      // 2. Validação da Nova Senha e Confirmação de Senha
      // Se o campo 'senha' (nova senha) foi preenchido, então 'confirmarSenha' também deve ser validado.
      if (senhaInput.value !== '') { // Se uma nova senha foi digitada
        if (senhaInput.value !== confirmarSenhaInput.value) {
          Swal.fire({
            icon: 'error',
            title: 'Erro de Validação!',
            text: 'As novas senhas digitadas não coincidem. Por favor, verifique.',
            confirmButtonText: 'Ok'
          });
          confirmarSenhaInput.classList.add('is-invalid'); // Marca o campo como inválido
          confirmarSenhaInput.focus();
          return false;
        } else if (senhaInput.value.length < 6) { // Validação de comprimento mínimo para a nova senha
          Swal.fire({
            icon: 'error',
            title: 'Erro de Validação!',
            text: 'A nova senha deve ter no mínimo 6 caracteres.',
            confirmButtonText: 'Ok'
          });
          senhaInput.classList.add('is-invalid');
          senhaInput.focus();
          return false;
        }
      } else { // Se 'senha' está em branco, limpa o campo 'confirmarSenha' para não causar validação desnecessária
        confirmarSenhaInput.value = '';
        confirmarSenhaInput.classList.remove('is-invalid'); // Remove a marcação se estava inválido
      }

      // Garante que a validação de email do Bootstrap é suficiente ou adicione regex mais complexa aqui se necessário.
      // Para 'type="email"', o navegador já faz uma validação básica de formato.
      // Se precisar de algo mais robusto, adicione um regex aqui, como:
      // if (!emailInput.value.match(/^[^@\s]+@[^@\s]+\.[^@\s]+$/)) { ... }

      // Se todas as validações passarem
      Swal.fire({
        icon: 'success',
        title: 'Usuário Atualizado!',
        text: 'Os dados do usuário foram salvos com sucesso.',
        showConfirmButton: false,
        timer: 2000 // Fecha automaticamente após 2 segundos
      });

      return true; // Permite o envio do formulário
    }

    // Funções para aplicar máscaras (se houver, como CPF, telefone, etc. - não aplicável diretamente aqui)
    $(document).ready(function () {
      // Se houvesse máscaras, elas seriam inicializadas aqui, ex:
      // $('#cpf').mask('000.000.000-00');
    });
  </script>
</body>

</html>
