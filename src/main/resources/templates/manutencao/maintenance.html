<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: top}"></th:block>
    <style>
    /* ==========================================================================
       1. PALETA DE CORES (DO DESIGN ORIGINAL)
       ========================================================================== */
    :root {
        --cor-primaria: #166298;      /* Azul principal */
        --cor-secundaria: #192f51;     /* Azul escuro para textos e hover */
        --cor-fundo-claro: #f8f9fc;    /* Fundo de cabeçalhos e seções */
        --cor-texto-escuro: #5a5c69;  /* Cinza para textos comuns */
        --cor-borda-suave: #e3e6f0;   /* Cinza claro para bordas */
        --cor-fundo-hover: #f1f3f8;   /* Fundo para hover em listas */
        --cor-perigo: #dc3545;       /* Vermelho (Bootstrap padrão) */
        --cor-sucesso: #198754;      /* Verde (Bootstrap padrão) */
        --cor-aviso: #ffc107;        /* Amarelo (Bootstrap padrão) */
    }

    body {
        background-color: #f1f5f9; /* Um fundo levemente acinzentado */
        color: var(--cor-texto-escuro);
    }

    /* ==========================================================================
       2. CABEÇALHO PRINCIPAL DO CARD
       ========================================================================== */
    .card.shadow {
        border: none;
        border-radius: 0.5rem;
    }
    
    .card-header {
        background-color: var(--cor-fundo-claro);
        border-bottom: 2px solid var(--cor-primaria); /* Borda azul destacada */
        padding: 1rem 1.5rem;
    }

    .card-header h6 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--cor-primaria) !important; /* Cor do título principal */
    }

    .card-header h6 .fas {
        margin-right: 10px;
    }

    .card-body {
        padding: 2rem;
    }

    /* ==========================================================================
       3. TÍTULOS E CARDS INTERNOS (SEÇÕES)
       ========================================================================== */
    .custom-card {
        background-color: #fff;
        border: 1px solid var(--cor-borda-suave); /* Borda suave */
        border-radius: 0.5rem;
        padding: 1.5rem;
        margin-bottom: 2rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    h2 {
        font-size: 1.05rem; /* Ajustado para hierarquia */
        font-weight: 700;
        color: var(--cor-secundaria); /* Cor secundária, como nas 'legends' */
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
    }

    h2 .fas {
        margin-right: 10px;
        color: var(--cor-secundaria);
    }

    /* ==========================================================================
       4. FORMULÁRIOS E INPUTS
       ========================================================================== */
    label, .form-label-icon {
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--cor-secundaria);
        margin-bottom: 0.5rem;
    }
    
    .form-label-icon .fas {
        margin-right: 6px;
        font-size: 0.8rem;
    }
    
    .form-control,
    .form-select {
        border-radius: 0.375rem;
        border: 1px solid var(--cor-borda-suave);
        transition: all 0.2s ease;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: var(--cor-primaria);
        box-shadow: 0 0 0 0.2rem rgba(22, 98, 152, 0.25); /* Sombra de foco azul */
    }

    /* ==========================================================================
       5. BOTÕES
       ========================================================================== */
    .btn {
        font-weight: 600 !important;
        transition: all 0.2s ease-in-out !important;
        border-radius: 0.375rem;
        padding: 0.6rem 1.2rem;
    }

    .btn:hover {
        transform: translateY(-2px) !important;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12) !important;
    }

    .btn-primary {
        background-color: var(--cor-primaria) !important;
        border-color: var(--cor-primaria) !important;
        color: white !important;
    }

    .btn-primary:hover {
        background-color: var(--cor-secundaria) !important;
        border-color: var(--cor-secundaria) !important;
    }

    /* ==========================================================================
       6. OUTROS ELEMENTOS (TABELA, PROGRESS BAR)
       ========================================================================== */
    .progress-bar {
       font-weight: 600;
    }
    .bg-success-custom { background-color: var(--cor-sucesso); }
    .bg-warning-custom { background-color: var(--cor-aviso); color: var(--cor-texto-escuro); }
    .bg-danger-custom { background-color: var(--cor-perigo); }
       
    .table {
        border: 1px solid var(--cor-borda-suave);
        border-radius: 0.5rem;
        overflow: hidden; /* Garante que o thead respeite o border-radius */
    }

    .table thead {
        background-color: var(--cor-fundo-claro);
    }
    
    .table th {
        color: var(--cor-secundaria);
        font-weight: 700;
    }

    .table tbody tr:hover {
        background-color: var(--cor-fundo-hover);
    }

    .table tfoot {
        background-color: var(--cor-fundo-claro);
        font-weight: 700;
        border-top: 2px solid var(--cor-borda-suave);
    }
</style>
</head>

<body>
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
                <i class="fas fa-tools mr-2"></i> Registro de Manutenção
            </h6>
        </div>

        <div class="card-body">
            <div class="custom-card">
                <h2><i class="fas fa-plus-square"></i> Nova Entrada de Manutenção</h2>
                <form th:action="@{/maintenance/save}" th:object="${form}" method="post" class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-2">
                            <label for="date" class="form-label-icon"><i class="fas fa-calendar-alt"></i> Data</label>
                            <input id="date" type="date" th:field="*{date}" class="form-control" />
                        </div>
                        <div class="col-md-2">
                            <label for="durationMinutes" class="form-label-icon"><i class="fas fa-clock"></i> Duração (min)</label>
                            <input id="durationMinutes" type="number" th:field="*{durationMinutes}" class="form-control" />
                        </div>
                        <div class="col-md-2">
                            <label for="type" class="form-label-icon"><i class="fas fa-tags"></i> Tipo</label>
                            <select id="type" th:field="*{type}" class="form-control">
                                <option value="" disabled th:if="${form.type == null}" selected>— selecione —</option>
                                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="performedBy" class="form-label-icon"><i class="fas fa-user-circle"></i> Quem</label>
                            <select id="performedBy" th:field="*{performedBy}" class="form-control">
                                <option value="" disabled th:if="${form.performedBy == null}" selected>— selecione —</option>
                                <option th:each="u : ${users}" th:value="${u}" th:text="${u}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="description" class="form-label-icon"><i class="fas fa-comment-dots"></i> Descrição</label>
                            <input id="description" type="text" th:field="*{description}" class="form-control" />
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4"><i class="fas fa-save"></i> Adicionar</button>
                </form>
            </div>

            <div class="custom-card">
                <h2><i class="fas fa-chart-line"></i> Uso Mensal de Manutenção</h2>
                <p class="mb-2" th:text="|${#numbers.formatDecimal(monthlyHours, 1, 1)}h / 20h|"></p>
                <div class="progress" style="height: 1.25rem;">
                    <div class="progress-bar" role="progressbar"
                        th:classappend="${monthlyPercent >= 100} ? ' bg-danger-custom' : (${monthlyPercent >= 75} ? ' bg-warning-custom' : ' bg-success-custom')"
                        th:style="'width: ' + ${monthlyPercent} + '%'" th:text="|${#numbers.formatDecimal(monthlyPercent, 0, 0)}%|">
                    </div>
                </div>
                <p class="text-muted mt-2 small">Sua meta mensal é de 20 horas de manutenção.</p>
            </div>

            <div class="custom-card">
                <h2><i class="fas fa-clipboard-list"></i> Entradas Recentes</h2>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th class="text-center"><i class="fas fa-calendar-day"></i> Data</th>
                                <th class="text-center"><i class="fas fa-hourglass-half"></i> Minutos</th>
                                <th class="text-center"><i class="fas fa-tools"></i> Tipo</th>
                                <th class="text-center"><i class="fas fa-user-tie"></i> Quem</th>
                                <th class="text-center"><i class="fas fa-file-alt"></i> Descrição</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${entries}">
                                <td class="text-center" th:text="${#temporals.format(e.date,'dd/MM/yyyy')}"></td>
                                <td class="text-center" th:text="${e.durationMinutes}"></td>
                                <td class="text-center" th:text="${e.type}"></td>
                                <td class="text-center" th:text="${e.performedBy}"></td>
                                <td class="text-center" th:text="${e.description}"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <th class="text-start text-center">Total Geral</th>
                                <th class="text-center" th:text="|${totalMinutes} min (${#numbers.formatDecimal(totalMinutes/60, 1, 1)}h ${totalMinutes % 60}m)|"></th>
                                <th colspan="3"></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <th:block th:replace="~{fragments/foot :: bot}"></th:block>
</body>

</html>
