<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head th:replace="~{fragments/head :: top}"></head>

<div class="card shadow mb-4">
  <div class="card-header py-3">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-edit mr-2"></i> Editar Processo
    </h6>
  </div>
  <div class="card-body">
    <form th:action="@{|/processos/editar/${processo.id}|}" method="post">

      <!-- DADOS DO PROCESSO -->
      <fieldset class="form-group border p-3">
        <legend class="w-auto px-2">Dados do Processo</legend>
        <div class="form-row">
          <div class="form-group col-md-3">
            <label for="numeroInterno">Número Interno</label>
            <input type="text" class="form-control" name="numeroInterno" readonly required th:value="${processo.numeroInterno}">
          </div>
          <div class="form-group col-md-5">
            <label for="numeroProcesso">Número Processo</label>
            <input type="text" class="form-control" name="numeroProcesso" required th:value="${processo.numeroProcesso}">
          </div>
          <div class="form-group col-md-2">
            <label for="dataInicio">Data Início</label>
            <input type="date" class="form-control" name="dataInicio" required th:value="${processo.dataInicio}">
          </div>
          <div class="form-group col-md-2">
            <label for="status">Status</label>
            <select class="form-control" name="status" required>
              <option th:each="s : ${statusValues}" th:value="${s}" th:text="${s}" th:selected="${processo.status == s}"></option>
            </select>
          </div>
          <div class="form-group col-md-12">
            <label for="localId">Local do Processo</label>
            <select class="form-control" name="localId" required>
              <option th:each="l : ${locais}" th:value="${l.id}" th:text="${l.comarca + ' – ' + l.localizacao}" th:selected="${processo.local.id == l.id}"></option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- PACIENTE -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Dados do Paciente</legend>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="pacienteId">Paciente</label>
            <select class="form-control" id="pacienteId" name="pacienteId" required>
              <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}" th:selected="${processo.paciente.id == p.id}"></option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label>CPF do Paciente</label>
            <input type="text" class="form-control" id="cpfPaciente" readonly th:value="${processo.paciente.cpf}">
          </div>
        </div>
      </fieldset>

      <!-- ADVOGADO -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Dados do Advogado</legend>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="advogadoId">Advogado</label>
            <select class="form-control" id="advogadoId" name="advogadoId" required>
              <option th:each="a : ${advogados}" th:value="${a.id}" th:text="${a.nome}" th:selected="${processo.advogado.id == a.id}"></option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label>OAB do Advogado</label>
            <input type="text" class="form-control" id="oabAdvogado" readonly th:value="${processo.advogado.oab}">
          </div>
        </div>
      </fieldset>

      <!-- MÉDICO -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Dados Médicos e Hospitalares</legend>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="medicoId">Médico</label>
            <select class="form-control" id="medicoId" name="medicoId" required>
              <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nome}" th:selected="${processo.medico.id == m.id}"></option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label>CRM do Médico</label>
            <input type="text" class="form-control" id="crmMedico" readonly th:value="${processo.medico.crm}">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="hospitalInput">Hospital</label>
            <input type="text" class="form-control" id="hospitalInput" name="hospitalNome"
                  th:value="${processo.hospital != null ? processo.hospital.nome : ''}" autocomplete="off">
            <input type="hidden" id="hospitalId" name="hospitalId"
                  th:value="${processo.hospital != null ? processo.hospital.id : ''}">
            <div id="autocompleteHospital" class="list-group mt-1"></div>
          </div>

          <div class="form-group col-md-6">
                  <label for="tipoHospital">Tipo de Hospital</label>
                  <select class="form-control" id="tipoHospital" name="tipoHospital">
          <option value="">Selecione</option>
          <option th:each="tipo : ${tiposHospital}"
                  th:value="${tipo}"
                  th:text="${tipo}"
                  th:selected="${processo.tipoHospital == tipo}">
          </option>
        </select>

        </div>
        </div>
      </fieldset>

      <!-- DOENÇA -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Detalhes da Doença</legend>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Localização da Doença</label>
            <select class="form-control" id="grupoDoenca" name="grupoDoencaId" required>
              <option value="">Selecione</option>
              <option th:each="g : ${gruposDoenca}" th:value="${g.id}" th:text="${g.nome}" th:selected="${g.id == processo.doenca?.grupo?.id}"></option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label>Tipo de Tumor</label>
            <select class="form-control" id="doenca" name="doencaId" required
                  th:attr="data-selected-id=${processo.doenca != null ? processo.doenca.id : ''}">
            <option value="">Selecione</option>
          </select>
          </div>
        </div>
      </fieldset>

      <!-- PRODUTOS -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Produtos do Processo</legend>
        <div class="form-group">
          <label for="produtoBusca">Adicionar Produto</label>
          <div class="input-group mb-2">
            <select id="produtoBusca" class="form-control">
              <option th:each="prod : ${produtos}" th:value="${prod.nomeItem}" th:text="${prod.nomeItem}"></option>
            </select>
            <div class="input-group-append">
              <button class="btn btn-outline-primary" type="button" onclick="addProduto()">Adicionar</button>
            </div>
          </div>
          <table class="table table-bordered" id="tabelaProdutos">
            <thead class="thead-light">
              <tr>
                <th>Produto</th>
                <th>Data</th>
                <th>Quantidade</th>
                <th style="width:1%">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${processo.itens}">
                <td th:text="${item.produto.nomeItem}"></td>
                <td>
                  <input type="hidden" name="produtoIds" th:value="${item.produto.id}" />
                  <input class="form-control" type="date" name="produtoDatas" th:value="${item.dataEnvio}" />
                </td>
                <td>
                  <input class="form-control" type="number" name="produtoQuantidades" th:value="${item.quantidade}" />
                </td>
                <td>
                  <button type="button" class="btn btn-sm btn-danger" onclick="removeProduto(this)">×</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </fieldset>

      <!-- DOCUMENTOS -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Documentos Anexados</legend>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="cpfAnexado" th:checked="${processo.cpfAnexado}" />
          <label class="form-check-label">CPF</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="compResidenciaAnexado" th:checked="${processo.compResidenciaAnexado}" />
          <label class="form-check-label">Comprovante de Residência</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="compRendaAnexado" th:checked="${processo.compRendaAnexado}" />
          <label class="form-check-label">Comprovante de Renda</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="procuracaoAnexado" th:checked="${processo.procuracaoAnexado}" />
          <label class="form-check-label">Procuração</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="declaracaoInsuficienciaAnexado" th:checked="${processo.declaracaoInsuficienciaAnexado}" />
          <label class="form-check-label">Declaração de Insuficiência</label>
        </div>
      </fieldset>

      <!-- OBSERVAÇÕES -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Observações</legend>
        <textarea class="form-control" name="obs" rows="3" th:text="${processo.obs}"></textarea>
      </fieldset>

      <div class="mt-4">
        <button type="submit" class="btn btn-success">Salvar Alterações</button>
        <a th:href="@{/processos/listar}" class="btn btn-secondary ml-2">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<!-- Scripts comuns -->
<div th:replace="~{fragments/foot :: bot}"></div>
<script>
  function removeProduto(btn) {
    btn.closest('tr').remove();
  }
</script>

<script th:inline="javascript">
  /*<![CDATA[*/
  const OK_BUTTON_CONFIG = {
    confirmButtonText: 'OK',
    confirmButtonColor: '#1B9BAE'
  };
  var produtos = /*[[${produtos}]]*/ [];
  console.log(produtos);

  function addProduto() {
    var nome = document.getElementById('produtoBusca').value;
    var prod = produtos.find(p => p.nomeItem === nome);
    if (!prod) {
      Swal.fire({ icon: 'warning', title: 'Produto não encontrado', ...OK_BUTTON_CONFIG });
      return;
    }

    var tbody = document.querySelector('#tabelaProdutos tbody');
    var tr = document.createElement('tr');

    // Coluna: nome do produto
    var tdNome = document.createElement('td');
    tdNome.textContent = prod.nomeItem;
    tr.appendChild(tdNome);

    // Coluna: data + hidden id
    var tdData = document.createElement('td');
    tdData.innerHTML =
      '<input type="hidden" name="produtoIds" value="' + prod.id + '"/>' +
      '<input type="date" name="produtoDatas" required class="form-control"/>';
    tr.appendChild(tdData);

    // Coluna: quantidade
    var tdQtd = document.createElement('td');
    tdQtd.innerHTML =
      '<input type="number" name="produtoQuantidades" min="1" value="1" required class="form-control"/>';
    tr.appendChild(tdQtd);

    // Coluna: botão de remoção
    var tdAcao = document.createElement('td');
    tdAcao.innerHTML =
      '<button type="button" class="btn btn-sm btn-danger" onclick="removeProduto(this)">&times;</button>';
    tr.appendChild(tdAcao);

    tbody.appendChild(tr);
    document.getElementById('produtoBusca').value = '';
  }

  function removeProduto(btn) {
    btn.closest('tr').remove();
  }
  /*]]>*/
</script>

<!-- Preencher CPF, OAB e CRM dinamicamente -->
<script>
  function preencherInfoPessoa(id, tipo) {
    if (!id) return;

    fetch(`/api/pessoas/${id}`)
      .then(res => res.json())
      .then(data => {
        if (tipo === 'paciente') {
          document.getElementById("cpfPaciente").value = data.cpf || '';
        } else if (tipo === 'advogado') {
          document.getElementById("oabAdvogado").value = data.oab || '';
        } else if (tipo === 'medico') {
          document.getElementById("crmMedico").value = data.crm || '';
        }
      });
  }

  document.getElementById("pacienteId").addEventListener("change", e => preencherInfoPessoa(e.target.value, 'paciente'));
  document.getElementById("advogadoId").addEventListener("change", e => preencherInfoPessoa(e.target.value, 'advogado'));
  document.getElementById("medicoId").addEventListener("change", e => preencherInfoPessoa(e.target.value, 'medico'));
</script>

<!-- Autocomplete hospital -->
<script>
  document.getElementById("hospitalInput").addEventListener("input", function () {
    const input = this.value;
    const resultBox = document.getElementById("autocompleteHospital");
    if (input.length < 2) {
      resultBox.innerHTML = '';
      return;
    }

    fetch(`/api/hospitais/buscar?nome=${encodeURIComponent(input)}`)
      .then(res => res.json())
      .then(hospitais => {
        resultBox.innerHTML = '';
        hospitais.forEach(h => {
          const item = document.createElement("button");
          item.type = "button";
          item.classList.add("list-group-item", "list-group-item-action");
          item.textContent = h.nome + (h.cidade ? ` (${h.cidade}/${h.estado})` : '');
          item.onclick = () => {
            document.getElementById("hospitalInput").value = h.nome;
            document.getElementById("hospitalId").value = h.id;
            resultBox.innerHTML = '';
          };
          resultBox.appendChild(item);
        });
      });
  });
</script>

<!-- Carregar tipos de doença ao trocar grupo -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const grupoSelect = document.getElementById("grupoDoenca");
    const doencaSelect = document.getElementById("doenca");

    function carregarDoencas(grupoId, doencaSelecionadaId = null) {
      if (!grupoId) {
        doencaSelect.innerHTML = '<option value="">Selecione uma localização primeiro</option>';
        doencaSelect.setAttribute("disabled", "disabled");
        return;
      }

      fetch(`/api/doencas/por-grupo/${grupoId}`)
        .then(res => res.json())
        .then(data => {
          doencaSelect.innerHTML = '<option value="">Selecione</option>';
          data.forEach(d => {
            const opt = document.createElement("option");
            opt.value = d.id;
            opt.textContent = d.nome;
            if (doencaSelecionadaId && d.id == doencaSelecionadaId) {
              opt.selected = true;
            }
            doencaSelect.appendChild(opt);
          });
          doencaSelect.removeAttribute("disabled");
        });
    }

    grupoSelect.addEventListener("change", function () {
      carregarDoencas(this.value);
    });

    // 🚨 Executa automaticamente no carregamento se já houver doença
    const grupoSelecionado = grupoSelect.value;
    const doencaSelecionada = document.getElementById("doenca").getAttribute("data-selected-id");
    if (grupoSelecionado && doencaSelecionada) {
      carregarDoencas(grupoSelecionado, doencaSelecionada);
    }
  });
</script>
