<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@ttskch/select2-bootstrap4-theme@x.x.x/dist/select2-bootstrap4.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<style>
  .btn-circle-sm {
    width: 30px !important;
    height: 30px !important;
    padding: 6px 0px !important;
    border-radius: 15px !important;
    text-align: center !important;
    font-size: 12px !important;
    line-height: 1.42857 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
</style>

<head th:replace="~{fragments/head :: top}"></head>

<div class="card shadow mb-4">
  <div class="card-header py-3">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-edit mr-2"></i> Editar Processo
    </h6>
  </div>
  <div class="card-body">
    <form th:action="@{|/processos/editar/${processo.id}|}" method="post" novalidate>

      <!-- DADOS DO PROCESSO -->
      <fieldset class="form-group border p-3">
        <legend class="w-auto px-2">Dados do Processo</legend>
        <div class="form-row">
          <div class="form-group col-md-3">
            <label for="numeroInterno">Número Interno</label>
            <input type="text" class="form-control" name="numeroInterno" readonly required
              th:value="${processo.numeroInterno}">
          </div>
          <div class="form-group col-md-5">
            <label for="numeroProcesso">Número Processo</label>
            <input type="text" class="form-control" name="numeroProcesso" required
              th:value="${processo.numeroProcesso}">
          </div>
          <div class="form-group col-md-2">
            <label for="dataInicio">Data Início</label>
            <input type="date" class="form-control" name="dataInicio" required th:value="${processo.dataInicio}">
          </div>
          <div class="form-group col-md-2">
            <label for="status">Status</label>
            <select class="form-control" name="status" required>
              <option th:each="s : ${statusValues}" th:value="${s}" th:text="${s}"
                th:selected="${processo.status == s}"></option>
            </select>
          </div>
          <div class="form-group col-md-12">
            <label for="localId">Local do Processo</label>
            <select class="form-control" name="localId" required>
              <option th:each="l : ${locais}" th:value="${l.id}" th:text="${l.comarca + ' – ' + l.localizacao}"
                th:selected="${processo.local.id == l.id}"></option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- PACIENTE -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Dados do Paciente</legend>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="pacienteId">Paciente</label>
            <select class="form-control" id="pacienteId" name="pacienteId" required>
              <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"
                th:selected="${processo.paciente.id == p.id}"></option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label>CPF do Paciente</label>
            <input type="text" class="form-control" id="cpfPaciente" readonly th:value="${processo.paciente.cpf}">
          </div>
        </div>
      </fieldset>

      <!-- ADVOGADO -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Dados do Advogado</legend>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="advogadoId">Advogado</label>
            <select class="form-control" id="advogadoId" name="advogadoId" required>
              <option th:each="a : ${advogados}" th:value="${a.id}" th:text="${a.nome}"
                th:selected="${processo.advogado.id == a.id}"></option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label>OAB do Advogado</label>
            <input type="text" class="form-control" id="oabAdvogado" readonly th:value="${processo.advogado.oab}">
          </div>
        </div>
      </fieldset>

      <!-- MÉDICO -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Dados Médicos e Hospitalares</legend>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="medicoId">Médico</label>
            <select class="form-control" id="medicoId" name="medicoId" required>
              <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nome}"
                th:selected="${processo.medico.id == m.id}"></option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label>CRM do Médico</label>
            <input type="text" class="form-control" id="crmMedico" readonly th:value="${processo.medico.crm}">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="hospitalInput">Hospital</label>
            <input type="text" class="form-control" id="hospitalInput" name="hospitalNome"
              th:value="${processo.hospital != null ? processo.hospital.nome : ''}" autocomplete="off">
            <input type="hidden" id="hospitalId" name="hospitalId"
              th:value="${processo.hospital != null ? processo.hospital.id : ''}">
            <div id="autocompleteHospital" class="list-group mt-1"></div>
          </div>

          <div class="form-group col-md-6">
            <label for="tipoHospital">Tipo de Hospital</label>
            <select class="form-control" id="tipoHospital" name="tipoHospital">
              <option value="">Selecione</option>
              <option th:each="tipo : ${tiposHospital}" th:value="${tipo}" th:text="${tipo}"
                th:selected="${processo.tipoHospital == tipo}">
              </option>
            </select>

          </div>
        </div>
      </fieldset>

      <!-- DOENÇA -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Detalhes da Doença</legend>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Localização da Doença</label>
            <select class="form-control" id="grupoDoenca" name="grupoDoencaId" required>
              <option value="">Selecione</option>
              <option th:each="g : ${gruposDoenca}" th:value="${g.id}" th:text="${g.nome}"
                th:selected="${g.id == processo.doenca?.grupo?.id}"></option>
            </select>
          </div>
          <div class="form-group col-md-6">
            <label>Tipo de Tumor</label>
            <select class="form-control" id="doenca" name="doencaId" required
              th:attr="data-selected-id=${processo.doenca != null ? processo.doenca.id : ''}">
              <option value="">Selecione</option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- PRODUTOS -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Produtos do Processo</legend>
        <div class="form-group">
          <label for="produtoBusca">Adicionar Produto</label>
          <div class="input-group mb-2">
            <select id="produtoBusca" class="form-control">
              <option th:each="prod : ${produtos}" th:value="${prod.nomeItem}" th:text="${prod.nomeItem}"></option>
            </select>
            <div class="input-group-append">
              <button class="btn btn-outline-primary" type="button" onclick="addProduto()">Adicionar</button>
            </div>
          </div>
          <table class="table table-bordered" id="tabelaProdutos">
            <thead class="thead-light">
              <tr>
                <th>Produto</th>
                <th>Data</th>
                <th>Quantidade</th>
                <th style="width:1%">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${processo.itens}">
                <td th:text="${item.produto.nomeItem}"></td>
                <td>
                  <input type="hidden" name="produtoIds" th:value="${item.produto.id}" />
                  <input class="form-control" type="date" name="produtoDatas" th:value="${item.dataEnvio}" />
                </td>
                <td>
                  <input class="form-control" type="number" name="produtoQuantidades" th:value="${item.quantidade}" />
                </td>
                <td>
                  <button type="button" class="btn btn-danger btn-circle-sm" onclick="removeProduto(this)">
                    <i class="fas fa-times"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </fieldset>

      <!-- DOCUMENTOS -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Documentos Anexados</legend>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="cpfAnexado" th:checked="${processo.cpfAnexado}" />
          <label class="form-check-label">CPF</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="compResidenciaAnexado"
            th:checked="${processo.compResidenciaAnexado}" />
          <label class="form-check-label">Comprovante de Residência</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="compRendaAnexado"
            th:checked="${processo.compRendaAnexado}" />
          <label class="form-check-label">Comprovante de Renda</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="procuracaoAnexado"
            th:checked="${processo.procuracaoAnexado}" />
          <label class="form-check-label">Procuração</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="declaracaoInsuficienciaAnexado"
            th:checked="${processo.declaracaoInsuficienciaAnexado}" />
          <label class="form-check-label">Declaração de Insuficiência</label>
        </div>
      </fieldset>

      <!-- OBSERVAÇÕES -->
      <fieldset class="form-group border p-3 mt-4">
        <legend class="w-auto px-2">Observações</legend>
        <textarea class="form-control" name="obs" rows="3" th:text="${processo.obs}"></textarea>
      </fieldset>

      <div class="mt-4">
        <button type="submit" class="btn btn-success">
          <i class="fas fa-save mr-2"></i>Salvar Alterações
        </button>

        <a th:href="@{/processos/listar}" class="btn btn-secondary ml-2">
          <i class="fas fa-times-circle mr-2"></i>Cancelar
        </a>
      </div>
    </form>
  </div>
</div>

<!-- Scripts comuns -->
<div th:replace="~{fragments/foot :: bot}"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>

<script th:inline="javascript">
  /*<![CDATA[*/

  // --- DEFINIÇÃO DAS FUNÇÕES AUXILIARES ---

  function removeProduto(btn) {
    // Usando jQuery para simplificar a remoção
    $(btn).closest('tr').remove();
  }

  function addProduto() {
    var produtos = /*[[${produtos}]]*/[];
    // Usando jQuery para pegar o valor e encontrar o produto
    var nome = $('#produtoBusca').val();
    var prod = produtos.find(p => p.nomeItem === nome);

    if (!prod) {
      Swal.fire({ icon: 'warning', title: 'Produto não encontrado', confirmButtonColor: '#1B9BAE' });
      return;
    }

    // Usando jQuery para adicionar a nova linha na tabela
    var novaLinha = `
        <tr>
            <td>${prod.nomeItem}</td>
            <td>
                <input type="hidden" name="produtoIds" value="${prod.id}"/>
                <input type="date" name="produtoDatas" required class="form-control"/>
            </td>
            <td>
                <input type="number" name="produtoQuantidades" min="1" value="1" required class="form-control"/>
            </td>
            <td>
            <button type="button" class="btn btn-danger btn-circle-sm" onclick="removeProduto(this)">
                <i class="fas fa-times"></i>
            </button>
        </td>
        </tr>
    `;
    $('#tabelaProdutos tbody').append(novaLinha);

    // Limpa o campo Select2 de busca de produto
    $('#produtoBusca').val(null).trigger('change');
  }

  function preencherInfoPessoa(id, tipo) {
    if (!id) {
      // Limpa o campo correspondente se a seleção for removida
      if (tipo === 'paciente') $('#cpfPaciente').val('');
      else if (tipo === 'advogado') $('#oabAdvogado').val('');
      else if (tipo === 'medico') $('#crmMedico').val('');
      return;
    }

    fetch(`/api/pessoas/${id}`)
      .then(res => res.json())
      .then(data => {
        if (tipo === 'paciente') $('#cpfPaciente').val(data.cpf || '');
        else if (tipo === 'advogado') $('#oabAdvogado').val(data.oab || '');
        else if (tipo === 'medico') $('#crmMedico').val(data.crm || '');
      });
  }

  function carregarDoencas(grupoId, doencaSelecionadaId = null) {
    const doencaSelect = $("#doenca");

    if (!grupoId) {
      doencaSelect.html('<option value=""></option>').prop("disabled", true);
      // Atualiza o Select2 para mostrar o placeholder de desabilitado
      doencaSelect.select2({
        theme: 'bootstrap4',
        placeholder: 'Selecione uma localização primeiro'
      });
      return;
    }

    fetch(`/api/doencas/por-grupo/${grupoId}`)
      .then(res => res.json())
      .then(data => {
        let options = '<option value="">Selecione</option>';
        data.forEach(d => {
          const isSelected = doencaSelecionadaId && d.id == doencaSelecionadaId ? 'selected' : '';
          options += `<option value="${d.id}" ${isSelected}>${d.nome}</option>`;
        });

        doencaSelect.html(options).prop("disabled", false);
        // Reinicializa ou atualiza o Select2 com as novas opções
        doencaSelect.select2({ theme: 'bootstrap4' });
      });
  }

  // --- CÓDIGO DE INICIALIZAÇÃO (Executa quando a página carrega) ---

  $(document).ready(function () {

    // ✅ PASSO PRINCIPAL: Ativa o Select2 em todos os campos <select>
    // A opção 'theme' faz com que ele se pareça com os campos do Bootstrap
    $('select').select2({
      theme: 'bootstrap4',
      allowClear: true,
      placeholder: "Selecione"
    });

    // --- ANEXANDO OS EVENTOS (Listeners) ---

    // Adiciona o listener para o botão de adicionar produto
    $('button[onclick="addProduto()"]').on('click', addProduto);

    // Anexa os listeners para preencher os dados de Paciente, Advogado e Médico
    $('#pacienteId, #advogadoId, #medicoId').on("change", function () {
      const id = $(this).val();
      const tipo = $(this).attr('id').replace('Id', '');
      preencherInfoPessoa(id, tipo);
    });

    // Anexa o listener para o autocomplete de hospital
    $('#hospitalInput').on("input", function () {
      const input = this.value;
      const resultBox = $("#autocompleteHospital");
      if (input.length < 2) {
        resultBox.html('');
        return;
      }
      fetch(`/api/hospitais/buscar?nome=${encodeURIComponent(input)}`)
        .then(res => res.json())
        .then(hospitais => {
          resultBox.html('');
          hospitais.forEach(h => {
            const item = $(`<button type="button" class="list-group-item list-group-item-action"></button>`);
            item.text(h.nome + (h.cidade ? ` (${h.cidade}/${h.estado})` : ''));
            item.on('click', () => {
              $("#hospitalInput").val(h.nome);
              $("#hospitalId").val(h.id);
              resultBox.html('');
            });
            resultBox.append(item);
          });
        });
    });

    // Anexa o listener para carregar as doenças dependentes
    $('#grupoDoenca').on("change", function () {
      carregarDoencas(this.value);
    });

    // --- EXECUTANDO CÓDIGO INICIAL ---

    // Executa o carregamento inicial da doença (caso de edição)
    const grupoSelecionado = $('#grupoDoenca').val();
    const doencaSelecionada = $('#doenca').attr("data-selected-id");
    if (grupoSelecionado) {
      carregarDoencas(grupoSelecionado, doencaSelecionada);
    }

    // Dentro de $(document).ready(function () { ... });

    // --- VALIDAÇÃO COM SWEETALERT ---
    $('form').on('submit', function (event) {
      let form = this;
      let camposValidos = true;

      // Verifica cada input/select com o atributo 'required'
      $(form).find('input[required], select[required]').each(function () {
        if ($(this).val() === "" || $(this).val() === null) {
          camposValidos = false;
        }
      });

      if (!camposValidos) {
        // Impede o envio do formulário
        event.preventDefault();

        // Mostra o alerta de erro
        Swal.fire({
          icon: 'error',
          title: 'Oops...',
          text: 'Por favor, preencha todos os campos obrigatórios!',
          confirmButtonColor: '#4e73df'
        });
      }
      // Se 'camposValidos' for true, o formulário será enviado normalmente.
    });

  });

  /*]]>*/
</script>
