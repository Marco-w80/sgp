<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:replace="~{fragments/head :: top}"></head>

<div class="card shadow mb-4">
  <div class="card-header py-3 d-sm-flex align-items-center justify-content-between mb-4">
    <h6 class="m-0 font-weight-bold text-primary">
      <i class="fas fa-clipboard-list mr-2"></i> Listar Processos
    </h6>
    <a th:href="@{/processos/cadastrar}" class="btn btn-primary">
      <i class="fas fa-plus mr-1"></i> Novo Processo
    </a>
  </div>

  <div class="card-body">
    <div class="table-responsive">
      <table id="tabelaProcessos" class="table table-bordered table-hover" width="100%" cellspacing="0">
        <thead class="thead-light">
          <tr>
            <th>ID</th>
            <th>Interno</th>
            <th>Processo</th>
            <th>Paciente</th>
            <th>Advogado</th>
            <th>Médico</th>
            <th>Início</th>
            <th>Status</th>
            <th>Local</th>
            <th>Produtos</th>
            <th>Obs</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${processos == null or #lists.isEmpty(processos)}">
            <td colspan="12" class="text-center">Nenhum processo encontrado</td>
          </tr>
          <tr th:each="proc : ${processos}">
            <td th:text="${proc.id}"></td>
            <td th:text="${proc.numeroInterno}"></td>
            <td th:text="${proc.numeroProcesso}"></td>
            <td th:text="${proc.paciente.nome}"></td>
            <td th:text="${proc.advogado.nome}"></td>
            <td th:text="${proc.medico.nome}"></td>
            <td th:text="${#temporals.format(proc.dataInicio, 'dd/MM/yyyy')}"></td>
            <td th:text="${proc.status}"></td>
            <td th:text="${proc.local.comarca + ' – ' + proc.local.localizacao}"></td>
            <td>
              <ul class="mb-0 pl-3">
                <li th:each="item : ${proc.itens}">
                  <span th:text="${item.produto.nomeItem}"></span>
                  &nbsp;– Qtd: <span th:text="${item.quantidade}"></span>
                  &nbsp;– Env.: <span th:text="${#temporals.format(item.dataEnvio, 'dd/MM/yyyy')}"></span>
                </li>
              </ul>
            </td>
            <td th:text="${proc.obs}"></td>
            <td class="text-nowrap">
              <a th:href="@{/processos/editar/{id}(id=${proc.id})}" class="btn btn-sm btn-secondary">
                <i class="fas fa-edit"></i>
              </a>
              <button class="btn btn-sm btn-info" 
                      data-toggle="modal" data-target="#modalVerProcesso"
                      th:attr="data-id=${proc.id}"> 
                <i class="fas fa-eye"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal de Visualização -->
<div class="modal fade" id="modalVerProcesso" tabindex="-1" role="dialog" aria-labelledby="modalVerLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="modalVerLabel">Detalhes do Processo</h5>
        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <div id="conteudoProcesso">
          <!-- Conteúdo será carregado via JavaScript -->
          <p class="text-muted">Carregando informações do processo...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Fragmentos e DataTables -->
<div th:replace="~{fragments/foot :: bot}"></div>
<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>

<script>
  $(document).ready(function () {
    $('#tabelaProcessos').DataTable({
      language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
      pageLength: 10,
      lengthMenu: [5, 10, 25, 50]
    });

    $('#modalVerProcesso').on('show.bs.modal', function (e) {
      const button = $(e.relatedTarget);
      const procId = button.data('id');
      const modalBody = document.getElementById('conteudoProcesso');
      modalBody.innerHTML = "<p class='text-muted'>Buscando informações...</p>";

      fetch(`/api/processos/${procId}/detalhes`)
      .then(res => res.json())
      .then(data => {
        // Lista de campos booleanos que devem ser traduzidos
        const camposBooleanos = [
          "CPF Anexado",
          "Comp. Residência",
          "Comp. Renda",
          "Procuração",
          "Decl. Insuficiência"
        ];

        // Gera o HTML dos logs
        const logsHtml = data.logs.map(log => {
          let valorAntigo = log.valorAntigo;
          let valorNovo = log.valorNovo;

          if (camposBooleanos.includes(log.campo)) {
            valorAntigo = log.valorAntigo === "true" ? "Anexado" : "Não anexado";
            valorNovo = log.valorNovo === "true" ? "Anexado" : "Removido";
          }

          return `<li><strong>${log.campo}</strong>: "${valorAntigo}" → "${valorNovo}" (${log.data})</li>`;
        }).join('');

        // Monta o HTML final
        let html = `
          <h6><strong>Interno:</strong> ${data.numeroInterno}</h6>
          <h6><strong>Processo:</strong> ${data.numeroProcesso}</h6>
          <h6><strong>Paciente:</strong> ${data.paciente.nome} - CPF: ${data.paciente.cpf}</h6>
          <h6><strong>Advogado:</strong> ${data.advogado.nome} - OAB: ${data.advogado.oab}</h6>
          <h6><strong>Médico:</strong> ${data.medico.nome} - CRM: ${data.medico.crm}</h6>
          <h6><strong>Status:</strong> ${data.status}</h6>
          <h6><strong>Data Início:</strong> ${data.dataInicio}</h6>
          <h6><strong>Local:</strong> ${data.local.comarca} – ${data.local.localizacao}</h6>
          <h6><strong>Observações:</strong> ${data.obs || '–'}</h6>

          <hr><h5>Produtos:</h5>
          <ul>${data.itens.map(item => `<li>${item.produto} – Qtd: ${item.quantidade} – Enviado: ${item.dataEnvio}</li>`).join('')}</ul>

          <hr><h5>Logs de Alterações:</h5>
          <ul>${logsHtml}</ul>
        `;

        document.getElementById('conteudoProcesso').innerHTML = html;
      })
      .catch(err => {
        document.getElementById('conteudoProcesso').innerHTML =
          "<div class='alert alert-danger'>Erro ao carregar dados do processo.</div>";
        console.error(err);
      });

    });
  });
</script>
</html>
