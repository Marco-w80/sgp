spring.datasource.url=jdbc:h2:mem:sgptest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.thymeleaf.cache=false
app.licitacoes.upload-dir=${java.io.tmpdir}/sgp-licitacoes-test
spring.task.scheduling.enabled=false
spring.mail.host=localhost
spring.mail.port=2525
app.alertas.email.from=test@example.com
app.alertas.email.teste.to=test@example.com
app.alertas.email.resumo.to=test@example.com
app.alertas.email.resumo.cron=0 0 0 1 1 *
app.alertas.email.resumo.zone=America/Sao_Paulo
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
